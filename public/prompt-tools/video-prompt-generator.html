<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视频生成提示词工具</title>
<style>
:root{--bg:#f5f5f7;--surface:#fff;--text:#1d1d1f;--t2:#6e6e73;--t3:#86868b;--border:#d2d2d7;--bl:#e8e8ed;--accent:#0071e3;--accent2:#0077ed;--asoft:#e8f1fd;--r:12px;--rs:8px;--shadow:0 1px 3px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.04)}
*{margin:0;padding:0;box-sizing:border-box} body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;font-size:15px}
.header{padding:48px 0 32px;text-align:center} .header h1{font-size:32px;font-weight:700;letter-spacing:-.5px} .header .sub{font-size:15px;color:var(--t3);margin-top:8px}
.container{max-width:1180px;margin:0 auto;padding:0 24px} .grid{display:grid;grid-template-columns:360px 1fr;gap:28px;align-items:start;padding-bottom:48px}
.inputs{position:sticky;top:24px} .field{margin-bottom:14px} .field label{display:block;font-size:13px;font-weight:600;color:var(--t2);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--rs);font-size:14px;background:var(--surface);color:var(--text);font-family:inherit}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--asoft)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-gen{width:100%;padding:10px;border:none;border-radius:var(--rs);background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer;margin-top:4px}
.outputs{min-width:0} .btn-copy-all{width:100%;padding:10px;border:none;border-radius:var(--rs);background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--bl);border-radius:var(--r);padding:18px 22px;margin-bottom:14px;box-shadow:var(--shadow)}
.card-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:12px} .card-tt{font-size:15px;font-weight:650}
.cbtn{padding:3px 12px;font-size:12px;font-weight:500;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--accent);cursor:pointer;white-space:nowrap;flex-shrink:0} .cbtn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.card-bd{font-size:13.5px;line-height:1.65;color:#424245;white-space:pre-wrap;word-break:break-word}
.footer{padding:24px 0 48px;text-align:center;font-size:13px;color:var(--t3)}
@media(max-width:900px){.grid{grid-template-columns:1fr}.inputs{position:static}}
</style>
</head>
<body>
<header class="header"><div class="container"><h1>视频生成提示词工具</h1><p class="sub">多引擎 · 运镜/首尾帧/时长 · 内置防 AI 抽搐</p></div></header>
<main class="container"><div class="grid">
<aside class="inputs">
  <div class="field"><label for="engine">引擎</label><select id="engine"></select></div>
  <div class="field"><label for="subject">主体 / 场景</label><textarea id="subject" rows="3" placeholder="例:一位老工匠在工作台前打磨黄铜怀表，桌上散落齿轮与放大镜"></textarea></div>
  <div class="field"><label for="camera">运镜</label><select id="camera">
    <option>推进 dolly-in</option>
    <option>拉出 dolly-out</option>
    <option>摇移 pan</option>
    <option>俯仰 tilt</option>
    <option>环绕 orbit</option>
    <option>航拍 aerial</option>
    <option>跟随 follow</option>
    <option>手持 handheld</option>
    <option>静止锁定 locked-off</option>
    <option>升降 crane</option>
    <option>第一人称 POV</option>
  </select></div>
  <div class="field-row">
    <div class="field"><label for="shot">景别</label><select id="shot">
      <option>全景</option>
      <option selected>中景</option>
      <option>特写</option>
      <option>微距</option>
    </select></div>
    <div class="field"><label for="light">光线</label><select id="light">
      <option selected>黄金时刻</option>
      <option>蓝调时刻</option>
      <option>正午硬光</option>
      <option>霓虹夜景</option>
      <option>柔光箱</option>
      <option>逆光剪影</option>
    </select></div>
  </div>
  <div class="field"><label for="style">风格 / 氛围</label><input id="style" type="text" placeholder="例:温暖怀旧、胶片质感、安静专注"></div>
  <div class="field-row">
    <div class="field"><label for="duration">时长</label><select id="duration">
      <option selected>5s</option>
      <option>10s</option>
      <option>首尾帧</option>
    </select></div>
    <div class="field"><label for="negative">负向</label><input id="negative" type="text" value="水印, 字幕, 屏幕文字, 变形, 闪烁, 低质, 模糊"></div>
  </div>
  <div class="field"><label for="first_frame">首帧描述（可选）</label><textarea id="first_frame" rows="2" placeholder="镜头起势:构图/光线/主体姿态/背景"></textarea></div>
  <div class="field"><label for="last_frame">尾帧描述（可选）</label><textarea id="last_frame" rows="2" placeholder="镜头收束:主体最终位置/情绪落点"></textarea></div>
  <button class="btn-gen" id="btn-gen">生成</button>
</aside>
<section class="outputs">
  <button class="btn-copy-all" id="btn-copy-all">全部复制</button>
  <div class="card"><div class="card-hd"><span class="card-tt">【主提示词】</span><button class="cbtn" data-copy="main">复制</button></div><div class="card-bd" id="out-main"></div></div>
  <div class="card"><div class="card-hd"><span class="card-tt">【运镜与参数】</span><button class="cbtn" data-copy="params">复制</button></div><div class="card-bd" id="out-params"></div></div>
  <div class="card"><div class="card-hd"><span class="card-tt">【首尾帧分镜】</span><button class="cbtn" data-copy="frames">复制</button></div><div class="card-bd" id="out-frames"></div></div>
  <div class="card"><div class="card-hd"><span class="card-tt">【引擎备注与防漂移】</span><button class="cbtn" data-copy="notes">复制</button></div><div class="card-bd" id="out-notes"></div></div>
  <div class="card"><div class="card-hd"><span class="card-tt">【通用规则】</span><button class="cbtn" data-copy="rules">复制</button></div><div class="card-bd" id="out-rules"></div></div>
</section>
</div></main>
<footer class="footer"><div class="container"><p>一次只描述一个主体动作 · 运镜只选一个 · 首尾帧越具体越好 · 英文引擎请用英文填主体</p></div></footer>
<script>
const KB={engines:[
  {id:'sora',name:'Sora',native_lang:'en',dialect:'cinematic-narrative',max_duration:'20s',param_style:'自然语言段落（无参数标签）',
   drift_risks:['画面浮现文字/水印/字幕','手指肢体扭曲（手部位置写清）','帧率闪烁/不稳定','主体外观逐帧漂移','物理穿模/重力失真'],
   tips:'详细自然语言远胜简洁指令；按「主体→运镜→光线→氛围→时间推进」顺序写；指明胶片质感（35mm/胶片颗粒）锁定电影感；一次只描述一个主体动作。'},
  {id:'veo',name:'Veo',native_lang:'en',dialect:'cinematic-narrative',max_duration:'8s',param_style:'自然语言段落（无参数标签）',
   drift_risks:['口型/音频不同步（Veo3 带音频）','快速运动模糊','屏幕文字生成','主体漂移','风格不一致'],
   tips:'Veo3 偏好明确场景+氛围；声音用自然语言描述（环境声/对白）；单个运镜指令即可；8s 内讲清一个动作。'},
  {id:'kling',name:'可灵 Kling',native_lang:'zh',dialect:'chinese-structured',max_duration:'10s',param_style:'中文结构化（主体+运镜词+光线+时长+首尾帧）',
   drift_risks:['人物面部崩坏','运动模糊拖影','中文字体乱入','时长超限被截断','首尾帧不连贯'],
   tips:'中文运镜词优先（推进/拉出/环绕/跟随）；标准时长 5s/10s；首尾帧用图片输入更稳；人物动作要具体到肢体。'},
  {id:'hailuo',name:'海螺 Hailuo',native_lang:'zh',dialect:'chinese-structured',max_duration:'10s',param_style:'中文描述（场景+动作+氛围）',
   drift_risks:['提示词被曲解歧义','风格漂移','运动幅度过大失控','文本残留'],
   tips:'描述具体明确、避免歧义词；擅长人物/动画/运动场景；时长 5s/10s；一个镜头一个核心动作。'},
  {id:'jimeng',name:'即梦视频',native_lang:'zh',dialect:'chinese-structured',max_duration:'10s',param_style:'中文自然语言+结构',
   drift_risks:['与提示词语义偏离','人物表情僵硬','画面卡顿跳帧','字幕残留'],
   tips:'字节系，中文描述自然流畅即可；支持首尾帧图片上传；运镜词简洁有效；适合叙事短片与转场。'},
  {id:'runway',name:'Runway',native_lang:'en',dialect:'style-motion',max_duration:'10s',param_style:'风格描述词 + motion 强度 1-10',
   drift_risks:['主体保持差（motion 过高）','风格化过度失真','运动不自然','细节闪烁'],
   tips:'motion 1-3 几乎静止/4-6 自然/7-10 剧烈；Gen-4 偏好简洁视觉描述；可加 cinematic、35mm film、shallow DOF 等标签。'},
  {id:'pika',name:'Pika',native_lang:'en',dialect:'concise',max_duration:'5s',param_style:'简洁提示词 + 参数',
   drift_risks:['时长短易截断','运动过度','风格漂移','比例失调'],
   tips:'提示词一段简洁话即可；-motion 控制运动幅度；-ar 设比例；适合短小精悍的单一镜头。'}
]};
const CAMERA_EN={'推进 dolly-in':'slowly pushing in toward the subject','拉出 dolly-out':'pulling back to reveal the wider scene','摇移 pan':'smooth horizontal pan','俯仰 tilt':'vertical tilt','环绕 orbit':'orbiting tracking shot circling the subject','航拍 aerial':'sweeping aerial drone shot','跟随 follow':'follow shot tracking the subject from behind','手持 handheld':'handheld, slightly restless camera','静止锁定 locked-off':'locked-off, static camera on a tripod','升降 crane':'crane shot rising and falling','第一人称 POV':'first-person POV'};
const CAMERA_ZH={'推进 dolly-in':'推进（缓速靠近主体）','拉出 dolly-out':'拉出（后退展开场景）','摇移 pan':'横向摇移','俯仰 tilt':'纵向俯仰','环绕 orbit':'环绕运镜','航拍 aerial':'航拍俯瞰','跟随 follow':'跟随运镜','手持 handheld':'手持摄影','静止锁定 locked-off':'固定机位（三脚架锁定）','升降 crane':'升降镜头','第一人称 POV':'第一人称主观镜头'};
const LIGHT_EN={'黄金时刻':'golden hour light','蓝调时刻':'blue hour twilight','正午硬光':'harsh midday sunlight','霓虹夜景':'neon-lit night','柔光箱':'soft diffused softbox lighting','逆光剪影':'backlit silhouette'};
const LIGHT_ZH={'黄金时刻':'黄金时刻柔光','蓝调时刻':'蓝调时刻冷调','正午硬光':'正午硬光高反差','霓虹夜景':'霓虹夜景','柔光箱':'柔光箱均匀光','逆光剪影':'逆光剪影'};
const SHOT_EN={'全景':'wide establishing shot','中景':'medium shot','特写':'close-up','微距':'macro shot'};
const SHOT_ZH={'全景':'全景','中景':'中景','特写':'特写','微距':'微距'};

function val(id){const el=document.getElementById(id);return el?el.value:''}
function curEng(){return KB.engines.find(e=>e.id===val('engine'))||KB.engines[0]}
function motionFor(cam){
  if(cam.indexOf('locked')>=0)return 2;
  if(cam.indexOf('handheld')>=0)return 8;
  if(cam.indexOf('orbit')>=0||cam.indexOf('aerial')>=0||cam.indexOf('follow')>=0||cam.indexOf('crane')>=0)return 7;
  if(cam.indexOf('POV')>=0||cam.indexOf('第一人称')>=0)return 6;
  if(cam.indexOf('推进')>=0||cam.indexOf('拉出')>=0||cam.indexOf('pan')>=0||cam.indexOf('tilt')>=0)return 5;
  return 5;
}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}

function buildMain(eng,v){
  const shotEn=SHOT_EN[v.shot]||'medium shot';
  const shotZh=SHOT_ZH[v.shot]||'中景';
  const camEn=CAMERA_EN[v.camera]||'slowly pushing in toward the subject';
  const camZh=CAMERA_ZH[v.camera]||'推进（缓速靠近主体）';
  const lightEn=LIGHT_EN[v.light]||'golden hour light';
  const lightZh=LIGHT_ZH[v.light]||'黄金时刻柔光';
  const mood=(v.style||'').trim();
  const scene=(v.subject||'').trim();
  const sceneSafe=scene||'（请先填写「主体/场景」）';
  const kf=v.duration==='首尾帧';
  if(eng.dialect==='cinematic-narrative'){
    const durPart=kf
      ? 'The shot is driven by the provided first and last keyframes, with a single coherent action bridging them'
      : 'Over a '+v.duration+' clip the moment unfolds in real time';
    return cap(shotEn)+'. '+sceneSafe+' The camera '+camEn+', holding the subject steadily in frame. '+cap(lightEn)+' shapes depth and texture across the scene. The atmosphere is '+(mood||'calm and grounded')+'. '+durPart+', with physically coherent motion — hands stay planted, light stays consistent, and no text, watermarks, subtitles, or logos appear on screen.';
  }
  if(eng.dialect==='chinese-structured'){
    const durZh=kf?'首尾帧模式（由首/尾帧驱动）':'时长约 '+v.duration;
    let s=shotZh+'。'+sceneSafe+camZh+'，'+lightZh+'，营造'+(mood||'真实自然')+'的氛围。'+durZh+'。只表现一个主体的单一动作，画面稳定不漂移，不出现文字、水印或字幕。';
    if(v.first_frame.trim())s+='\n首帧参考：'+v.first_frame.trim()+'。';
    if(v.last_frame.trim())s+='\n尾帧参考：'+v.last_frame.trim()+'。';
    return s;
  }
  if(eng.dialect==='style-motion'){
    const m=motionFor(v.camera);
    const kfp=kf?' keyframe-driven,':'';
    return cap(shotEn)+','+kfp+' '+sceneSafe+' camera '+camEn+', '+lightEn+', '+(mood||'cinematic')+' style, 35mm film grain, shallow depth of field, high detail. Motion strength: '+m+'/10.';
  }
  if(eng.dialect==='concise'){
    const m=motionFor(v.camera);
    const kfp=kf?'keyframe-driven, ':'';
    return cap(shotEn)+', '+kfp+sceneSafe+', '+camEn+', '+lightEn+', '+(mood||'cinematic')+'. -motion '+m+' -ar 16:9 -fps 24';
  }
  return sceneSafe;
}
function buildParams(eng,v){
  const camEn=CAMERA_EN[v.camera]||'slowly pushing in';
  const camZh=CAMERA_ZH[v.camera]||'推进';
  const shotZh=SHOT_ZH[v.shot]||'中景';
  const lightZh=LIGHT_ZH[v.light]||'黄金时刻柔光';
  const durLabel=v.duration==='首尾帧'?'首尾帧模式':v.duration;
  let s='运镜方式：'+camZh+'（'+camEn+'）\n';
  s+='景别：'+shotZh+'\n';
  s+='光线：'+lightZh+'（'+v.light+'）\n';
  s+='时长：'+durLabel+'（'+eng.name+' 上限 '+eng.max_duration+'）\n';
  s+='参数风格：'+eng.param_style+'\n';
  s+='首帧：'+(v.first_frame.trim()||'未设置')+'\n';
  s+='尾帧：'+(v.last_frame.trim()||'未设置');
  if(eng.dialect==='style-motion'||eng.dialect==='concise'){
    s+='\nMotion 强度：'+motionFor(v.camera)+'/10（基于运镜自动推荐）';
  }
  return s;
}
function buildFrames(v){
  const f=v.first_frame.trim(), l=v.last_frame.trim();
  if(!f&&!l){
    let base='单镜头（未设置首尾帧）。本片为单一连续镜头，在主提示词中描述好主体动作的起止即可；如需精确控制起势与收束，建议在上方填写首/尾帧描述，或直接上传参考图给可灵/即梦/Runway。';
    if(v.duration==='首尾帧'){
      base='提示：已选择「首尾帧」时长模式，但未填写首/尾帧描述——模型将自行决定起止画面。建议补充首帧与尾帧描述以锁死画面。\n\n'+base;
    }
    return base;
  }
  return '【首帧】'+(f||'（未提供，由模型自行决定起势）')+'\n【尾帧】'+(l||'（未提供，由模型决定收束）')+'\n\n过渡建议：描述主体从首帧到尾帧之间的一个连贯动作（如「右手缓缓拿起怀表，举至眼前」），避免多个并列动作。';
}
function buildNotes(eng){
  let s='■ '+eng.name+' 引擎特性\n'+eng.tips+'\n\n';
  s+='■ 主要漂移风险（按严重度排序）\n';
  eng.drift_risks.forEach((r,i)=>{s+=(i+1)+'. '+r+'\n'});
  s+='\n■ 通用防 AI 抽搐\n';
  s+='• 文字/水印：在负向中明确写「no text, watermark, subtitles, UI」/「无水印字幕」\n';
  s+='• 肢体错乱：写清手部位置与动作（「双手自然下垂」「右手握住杯柄」）\n';
  s+='• 闪烁抖动：指定 24fps、胶片质感、locked-off 锁定机位\n';
  s+='• 首尾帧不一致：描述两者之间的过渡动作，而非两个孤立姿态\n';
  s+='• 一次只描述一个主体动作，多动作会触发混乱\n';
  s+='• 英文引擎（Sora/Veo/Runway/Pika）请用英文填写主体描述，避免中英混杂';
  return s;
}
function buildRules(eng,v){
  const neg=(v.negative||'').trim()||'水印, 字幕, 变形, 闪烁, 低质';
  let s='1. 负向 prompt 必填：'+neg+'\n';
  s+='2. 首尾帧越具体越好——写明构图、光线、主体姿态、背景元素\n';
  s+='3. 避免「精美/震撼/电影级」等空泛词，改用具体视觉（「35mm 胶片颗粒」「焦段 50mm」「景深很浅」）\n';
  s+='4. 一次只描述一个主体动作；多动作 = 多 bug\n';
  s+='5. 时长尊重 '+eng.name+' 上限（'+eng.max_duration+'），超限会被截断或拒生成\n';
  s+='6. 运镜只选一个；复合运镜（如「推进+环绕」）容易失控\n';
  s+='7. 光线与风格自洽（霓虹夜景 + 柔光箱 = 矛盾）\n';
  s+='8. 主体在画面中的位置要写清（居中/左侧三分之一/逆光站位）';
  return s;
}
function generate(){
  const eng=curEng();
  const v={subject:val('subject'),camera:val('camera'),shot:val('shot'),light:val('light'),style:val('style'),duration:val('duration'),first_frame:val('first_frame'),last_frame:val('last_frame'),negative:val('negative')};
  document.getElementById('out-main').textContent=buildMain(eng,v);
  document.getElementById('out-params').textContent=buildParams(eng,v);
  document.getElementById('out-frames').textContent=buildFrames(v);
  document.getElementById('out-notes').textContent=buildNotes(eng);
  document.getElementById('out-rules').textContent=buildRules(eng,v);
}
function fallbackCopy(text){const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();try{document.execCommand('copy')}catch(e){}document.body.removeChild(t)}
function copyText(text,btn){const o=btn.textContent;const done=()=>{btn.textContent='已复制 ✓';btn.style.background='var(--accent)';btn.style.color='#fff';btn.style.borderColor='var(--accent)';setTimeout(()=>{btn.textContent=o;btn.style.background='';btn.style.color='';btn.style.borderColor=''},1500)};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done).catch(()=>{fallbackCopy(text);done()})}else{fallbackCopy(text);done()}}
function copyAll(){const parts=['【主提示词】',document.getElementById('out-main').textContent,'','【运镜与参数】',document.getElementById('out-params').textContent,'','【首尾帧分镜】',document.getElementById('out-frames').textContent,'','【引擎备注与防漂移】',document.getElementById('out-notes').textContent,'','【通用规则】',document.getElementById('out-rules').textContent];copyText(parts.join('\n'),document.getElementById('btn-copy-all'))}
function init(){
  const es=document.getElementById('engine');
  KB.engines.forEach(e=>{const o=document.createElement('option');o.value=e.id;o.textContent=e.name;es.appendChild(o)});
  const ids=['engine','subject','camera','shot','light','style','duration','first_frame','last_frame','negative'];
  ids.forEach(id=>{const el=document.getElementById(id);if(el){el.addEventListener('input',generate);el.addEventListener('change',generate)}});
  document.getElementById('btn-gen').addEventListener('click',generate);
  document.getElementById('btn-copy-all').addEventListener('click',copyAll);
  document.querySelectorAll('.cbtn').forEach(b=>{b.addEventListener('click',()=>{const k=b.dataset.copy;copyText(document.getElementById('out-'+k).textContent,b)})});
  generate();
}
init();
</script>
