<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>即梦图像提示词生成器</title>
<style>
  :root{
    --bg:#fbfbfd; --card:#ffffff; --border:#e0e0e6; --text:#1d1d1f; --secondary:#6e6e73;
    --accent:#0071e3; --accent-hover:#0077ed; --radius:14px; --radius-sm:10px;
    --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05);
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px; margin:0 auto; padding:40px 24px 56px;}
  header h1{font-size:30px; font-weight:600; letter-spacing:-.01em; margin:0;}
  header .sub{color:var(--secondary); font-size:15px; margin-top:8px;}
  .grid{display:grid; grid-template-columns:380px 1fr; gap:28px; align-items:start; margin-top:30px;}
  .left{position:sticky; top:24px;}
  .card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:22px; box-shadow:var(--shadow);}
  .field{margin-bottom:16px;}
  .field:last-child{margin-bottom:0;}
  label{display:block; font-size:13px; font-weight:600; margin-bottom:7px; color:var(--text);}
  .hint{font-weight:400; color:var(--secondary); font-size:12px;}
  input[type=text], select, textarea{
    width:100%; padding:9px 11px; font-size:14px; border:1px solid var(--border); border-radius:var(--radius-sm);
    background:#fff; color:var(--text); font-family:inherit; transition:border-color .15s, box-shadow .15s;
  }
  textarea{resize:vertical; min-height:74px;}
  input:focus, select:focus, textarea:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(0,113,227,.15);}
  .presets{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px;}
  .preset-btn{padding:6px 13px; font-size:13px; border:1px solid var(--border); border-radius:999px; background:#fff; cursor:pointer; color:var(--text); font-family:inherit; transition:all .15s;}
  .preset-btn:hover{border-color:var(--accent); color:var(--accent);}
  .preset-btn.active{background:var(--accent); color:#fff; border-color:var(--accent);}
  .btn{background:var(--accent); color:#fff; border:none; padding:12px 18px; border-radius:var(--radius-sm); font-size:15px; font-weight:600; cursor:pointer; width:100%; font-family:inherit; transition:background .15s;}
  .btn:hover{background:var(--accent-hover);}
  .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
  .topbar h2{font-size:18px; font-weight:600; margin:0;}
  .copy-all{background:var(--text); color:#fff; border:none; padding:8px 16px; border-radius:999px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; transition:opacity .15s;}
  .copy-all:hover{opacity:.85;}
  .out-card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; margin-bottom:16px; box-shadow:var(--shadow);}
  .out-card h3{margin:0 0 10px; font-size:15px; font-weight:600; display:flex; justify-content:space-between; align-items:center; gap:12px;}
  .copy-btn{background:#f2f2f5; border:1px solid var(--border); color:var(--text); padding:4px 12px; border-radius:999px; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit; transition:all .15s; flex-shrink:0;}
  .copy-btn:hover{background:var(--accent); color:#fff; border-color:var(--accent);}
  .copy-btn.copied{background:#34c759; color:#fff; border-color:#34c759;}
  .out-body{white-space:pre-wrap; word-break:break-word; font-size:14px; line-height:1.75; color:#3a3a3c;}
  #out-en{font-family:var(--mono); font-size:13px;}
  footer{text-align:center; color:var(--secondary); font-size:13px; margin-top:40px; padding-top:24px; border-top:1px solid var(--border);}
  @media (max-width:900px){
    .grid{grid-template-columns:1fr;}
    .left{position:static;}
    .wrap{padding:28px 16px 48px;}
    header h1{font-size:25px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>即梦图像提示词生成器</h1>
    <div class="sub">16 风格 · 中文自然语言 · 内置防漂移 · 离线即用</div>
  </header>

  <div class="grid">
    <!-- LEFT: INPUTS -->
    <aside class="left">
      <div class="card">
        <div class="field">
          <h3 style="font-size:13px;font-weight:600;margin:0 0 7px;">一键预设</h3>
          <div class="presets" id="presets"></div>
        </div>

        <div class="field">
          <label for="f-style">风格</label>
          <select id="f-style"></select>
        </div>

        <div class="field">
          <label for="f-subject">主体描述 <span class="hint">（留空则用当前风格的示例主体）</span></label>
          <textarea id="f-subject" placeholder="例如：一位穿月白色汉服的少女站在樱花树下，微风轻拂发丝"></textarea>
        </div>

        <div class="field">
          <label for="f-comp">构图</label>
          <select id="f-comp"></select>
        </div>

        <div class="field">
          <label for="f-lens">镜头 / 焦段</label>
          <select id="f-lens"></select>
        </div>

        <div class="field">
          <label for="f-light">光影</label>
          <select id="f-light"></select>
        </div>

        <div class="field">
          <label for="f-color">色调</label>
          <select id="f-color"></select>
        </div>

        <div class="field">
          <label for="f-mood">氛围 <span class="hint">（可选，留空用风格默认）</span></label>
          <input type="text" id="f-mood" placeholder="例如：温润清雅、静谧怀旧">
        </div>

        <div class="field">
          <label for="f-aspect">比例</label>
          <select id="f-aspect"></select>
        </div>

        <div class="field">
          <label for="f-neg">负向提示词（排除词）</label>
          <input type="text" id="f-neg">
        </div>

        <div class="field">
          <button class="btn" id="genBtn">立即生成</button>
        </div>
      </div>
    </aside>

    <!-- RIGHT: OUTPUTS -->
    <section class="right">
      <div class="topbar">
        <h2>生成结果</h2>
        <button class="copy-all" id="copyAll">全部复制</button>
      </div>

      <div class="out-card">
        <h3>【中文提示词】 <button class="copy-btn" data-k="cn">复制</button></h3>
        <div class="out-body" id="out-cn"></div>
      </div>

      <div class="out-card">
        <h3>【负向提示词】 <button class="copy-btn" data-k="neg">复制</button></h3>
        <div class="out-body" id="out-neg"></div>
      </div>

      <div class="out-card">
        <h3>【英文关键词】 <button class="copy-btn" data-k="en">复制</button></h3>
        <div class="out-body" id="out-en"></div>
      </div>

      <div class="out-card">
        <h3>【参数建议】 <button class="copy-btn" data-k="param">复制</button></h3>
        <div class="out-body" id="out-param"></div>
      </div>

      <div class="out-card">
        <h3>【防漂移清单 + 即梦技巧】 <button class="copy-btn" data-k="drift">复制</button></h3>
        <div class="out-body" id="out-drift"></div>
      </div>
    </section>
  </div>

  <footer>一段流畅中文 + 一个主风格 + 负向词框排除手脚文字崩坏 — 即梦出好图的关键。</footer>
</div>

<script>
const STYLES = [{"category":"摄影写实类","default_subject_example":"一位穿米白色亚麻衬衫的年轻女人，黑发松松挽在脑后，耳后垂下几缕碎发","donts":["不要堆叠冲突风格词(如\"水彩+写实+油画\"同框),画面会发糊","不要用强顶光或机顶直闪,会产生油光与生硬阴影","不要在背景塞太多抢眼元素,主体必须是最清晰的焦点","不要在人脸上要求长中文文字(刺青/标语),极易乱码"],"dos":["指定服装材质与颜色(亚麻、棉麻、丝绸、针织),显著提升真实感","优先自然光源:窗户漫射光、黄金时刻、阴天柔光","描述发丝状态(碎发、绒毛、逆光光晕)增加层次与立体感","明确人物视线方向与情绪(望向窗外、低头沉思、直视镜头)","在{subject}里给出人物姿态与手部位置,减少手指异常"],"drift_risks":[{"fix":"在{subject}里明确手部姿态(如\"双手自然插在口袋里\"\"单手托腮\"),并在negatives加\"六指、连指、多余手指、畸形手指\"","risk":"多出/合并的手指(六指、蹼状指、手指数量错乱),尤其是手出现在画面中时","severity":"HIGH"},{"fix":"强调\"真实皮肤质感,保留毛孔、细纹、微小雀斑,拒绝磨皮滤镜\",negatives加\"塑料感皮肤、过度磨皮、蜡像感\"","risk":"塑料感/蜡像感的过度磨皮皮肤,失去真实质感","severity":"HIGH"},{"fix":"显式写入\"五官对称、双眼清澈\",并指定\"眼眸带自然眼神光(catchlight)\"","risk":"五官不对称、眼睛浑浊无神或眼神光缺失","severity":"MEDIUM"},{"fix":"在{composition}指定主体在画面三分之一交点,背景元素简化,并用\"柔和散景\"虚化","risk":"发丝与背景融合粘连,主体边缘不分明","severity":"MEDIUM"},{"fix":"光源单一且柔和(窗光/柔光箱),避免多光源打架","risk":"多重眼神光或多重阴影,光线方向混乱","severity":"LOW"}],"id":"portrait-photo","keywords_cn":["真实皮肤质感","可见毛孔","微小雀斑","眼神光","浅景深","柔和散景","85mm人像镜头","自然肤色","发丝分明","高解析度写实"],"keywords_en":["realistic skin texture","visible pores","subtle freckles","catchlight","shallow depth of field","soft bokeh","85mm portrait lens","natural skin tone","hair strands in focus","high-resolution photorealism"],"name_cn":"人像写真","name_en":"Portrait Photography","negatives":["多余手指","六指","连指","残缺手指","塑料感皮肤","过度磨皮","蜡像感","不对称眼睛","眼神浑浊","面部不对称","双下巴","油光过重","水印","文字logo","模糊","过度锐化"],"prompt_template_cn":"{subject}，{composition}，{lens}，{lighting}，真实皮肤纹理与可见毛孔、微小雀斑，眼眸清澈带眼神光，发丝分明，{color}，{mood}，高解析度写实摄影","recommended_aspect":"3:4"},{"category":"摄影写实类","default_subject_example":"一碟刚出锅的红油抄手，热气升腾，抄手表面泛着油亮光泽，撒上葱花与白芝麻","donts":["不要用闪光灯直打,油面会过曝惨白","不要在画面里堆满菜品,留白才有食欲","不要在盘面/包装上要求长中文文字,模型易出乱码","不要用RGB彩色氛围灯,食物颜色会失真"],"dos":["描述食物的烹调状态(刚出锅、滋滋冒油、表皮微焦、糖浆拉丝)","指明光源方向(侧逆光、窗光),侧逆光最能表现油润质感","用简单有质感的道具(木砧板、粗陶碗、亚麻餐巾)做背景","指定拍摄角度(俯拍、45度、平视),不同角度食欲感不同"],"drift_risks":[{"fix":"在{subject}明确\"自然烹调色泽,表皮微焦不均匀,油亮但不过曝\"","risk":"食物看起来假、塑料感,像道具模型而非真菜","severity":"HIGH"},{"fix":"不要要求盘面/包装上的文字;若必须,只用\"一两个字\"并指定\"端正字体\"","risk":"餐盘/包装上的中文文字乱码或变形","severity":"HIGH"},{"fix":"指定\"柔和侧逆光\"而非直闪,negatives加\"过曝高光、死白\"","risk":"油面/酱汁高光过曝成死白,丢失层次","severity":"MEDIUM"},{"fix":"构图精简,negatives加\"多余餐具、杂乱道具、异物\"","risk":"画面塞入不可食或突兀的杂物,破坏食欲","severity":"MEDIUM"},{"fix":"指定真实克制的色调(如\"暖黄、酱红、橄榄绿\"),避免\"荧光、霓虹\"","risk":"颜色失真,出现荧光/霓虹般的非食物色调","severity":"LOW"}],"id":"food-closeup","keywords_cn":["美食微距摄影","油润光泽","热气氤氲","食材纹理","酱汁颗粒","浅景深","俯拍","45度角","食欲感","侧逆光"],"keywords_en":["food macro photography","glistening oil sheen","rising steam","ingredient texture","sauce granules","shallow depth of field","overhead shot","45-degree angle","appetizing","side backlight"],"name_cn":"美食特写","name_en":"Food Close-up","negatives":["塑料质感食物","伪造食物","过曝高光","死白油光","颜色失真","荧光色","焦点模糊","多余餐具抢镜","异物","蟑螂","污渍","水印","多余手指","长文字乱码"],"prompt_template_cn":"{subject}，{composition}，{lens}，{lighting}，食物表面油润光泽、热气氤氲升腾，酱汁颗粒分明，以四十五度斜俯拍视角呈现，{color}，{mood}","recommended_aspect":"4:5"},{"category":"摄影写实类","default_subject_example":"一只磨砂玻璃香水瓶，瓶身微微透出淡琥珀色液体，瓶盖为拉丝金属，置于纯灰亚麻布上","donts":["不要在产品上要求复杂长文字或精确logo,极易乱码","不要同框堆多个产品,单主体更稳更清晰","不要用RGB彩色氛围灯,颜色会失真偏离真实产品色","不要用复杂花纹背景,会与产品争夺视觉"],"dos":["指定材质(磨砂玻璃、抛光金属、拉丝铝、磨砂塑料),模型会忠实还原反射特性","明确背景(纯白、纯灰、渐变、亚麻布),让产品跳出来","描述布光方案(柔光箱主光+反光板补光+轮廓光),影棚感更专业","限定单主体,避免多产品干扰材质表现"],"drift_risks":[{"fix":"logo描述保持抽象(\"简洁字母标识\"),或指定字体\"无衬线、端正\"并只给2-4个字符;negatives加\"乱码、变形文字\"","risk":"品牌logo、瓶身文字乱码或扭曲变形","severity":"HIGH"},{"fix":"指定\"干净柔光环境,单一柔和主光\",negatives加\"杂乱反光、多重倒影、指纹\"","risk":"玻璃/金属表面出现杂乱反光、环境倒影、指纹","severity":"HIGH"},{"fix":"negatives加\"灰尘、划痕、指纹、污点\",并写\"产品洁净如新\"","risk":"产品表面出现灰尘颗粒、划痕、瑕疵伪影","severity":"MEDIUM"},{"fix":"对瓶身/盒装产品指定\"轮廓笔直、几何对称、无透视畸变\"","risk":"产品几何扭曲(瓶身歪斜、圆形变椭圆)","severity":"MEDIUM"},{"fix":"强调\"色彩还原准确、中性白平衡\",避免\"高饱和、滤镜\"","risk":"色彩偏色过饱和,产品色失真","severity":"LOW"}],"id":"product-stilllife","keywords_cn":["商业产品摄影","静物","材质表现","玻璃通透","金属拉丝","影棚级布光","柔光箱","干净背景","高解析度","焦点锐利"],"keywords_en":["commercial product photography","still life","material rendering","translucent glass","brushed metal","studio lighting","softbox","clean background","high resolution","sharp focus"],"name_cn":"产品静物","name_en":"Product Still Life","negatives":["划痕","灰尘颗粒","指纹","杂乱反光","多重倒影","背景污渍","模糊","logo乱码","变形文字","颜色失真","过曝","塑料感","水印","透视畸变"],"prompt_template_cn":"{subject}，{composition}，{lens}，{lighting}，产品表面材质细腻，玻璃反射与金属拉丝纹理清晰，无指纹无划痕，f/8大景深确保全身合焦，焦点锁定品牌标识，衬以纯色背景，{color}，{mood}","recommended_aspect":"1:1"},{"category":"摄影写实类","default_subject_example":"一位穿卡其色风衣的女人站在雨夜街头，霓虹倒映在湿漉漉的柏油路面上，侧脸望向画面之外","donts":["不要混搭风格(如\"胶片+3D+水彩+油画\"同框),画面会发糊发乱","不要堆砌过多叙事元素,主体必须明确单一","不要要求远处招牌清晰文字,招牌应随浅景深虚化","不要把人物手部暴露在画面边缘,易出现多余手指"],"dos":["用环境光(霓虹、雨夜、黄金时刻、烛光)营造电影氛围","描述人物姿态、视线方向与动作,增强叙事张力","指定胶片型号色调(Porta 400暖肤色、CineStill 800T夜霓虹、富士Velvia高饱和)更精准","用宽银幕比例(16:9、21:9)增强电影叙事感"],"drift_risks":[{"fix":"film-still绝不能与\"3D渲染/水彩/卡通/油画/赛博朋克霓虹堆叠\"同框;保持\"35mm胶片纪实\"为唯一主风格","risk":"风格词冲突导致画面发糊、混乱(如误叠\"3D渲染\"\"水彩\"\"赛博朋克\")","severity":"HIGH"},{"fix":"人物手部藏入口袋/背后或移出画框,negatives加\"多余手指、六指、多余肢体\"","risk":"环境场景中人物多出肢体/手指(尤其半身、街头群像)","severity":"HIGH"},{"fix":"远处招牌用\"浅景深\"虚化掉,不指定招牌的具体文字内容","risk":"远处霓虹招牌/路牌中文乱码或扭曲","severity":"MEDIUM"},{"fix":"主体只留一个人物或一组关系,背景元素 atmospherically 虚化","risk":"叙事元素堆砌过多,主体不明确,画面杂乱","severity":"MEDIUM"},{"fix":"用\"细腻胶片颗粒\"而非\"粗颗粒、重度噪点\"","risk":"颗粒过重导致画面脏污、细节丢失","severity":"LOW"}],"id":"film-still","keywords_cn":["电影胶片质感","35mm纪实摄影","细腻颗粒","光晕","暗角","宽银幕","叙事感","浅景深","柯达Portra","CineStill","环境光氛围"],"keywords_en":["cinematic film aesthetic","35mm documentary photography","fine grain","halation","vignette","widescreen","narrative mood","shallow depth of field","Kodak Portra","CineStill","ambient atmosphere"],"name_cn":"电影剧照/胶片感","name_en":"Film Still / Cinematic","negatives":["数码塑料感","过度锐利","高饱和数码感","时尚大片棚拍感","廉价滤镜","多余手指","六指","多余肢体","剧烈形变","霓虹招牌乱码","水印","logo"],"prompt_template_cn":"{subject}，{composition}，{lens}，{lighting}，宽银幕画幅，自然光晕与轻微暗角，柯达Portra 400，{color}，{mood}","recommended_aspect":"16:9"},{"category":"艺术插画类","de const PLATFORM = {"donts":["Don't write Midjourney-style English/Chinese tag piles ('少女,汉服,樱花,古风,8k,杰作,精致') — Jimeng is a Chinese natural-language model; feed it coherent prose sentences.","Don't stack conflicting style tags ('照片级真实 + 水彩 + 3D渲染 + 油画') — the model averages co-equal styles into blur and chaos. Pick ONE dominant style; let other terms modify (lighting, mood) rather than compete.","Don't stuff the prompt with empty quality buzzwords — '8k, masterpiece, best quality, 杰作, 顶级画质' are leftover SD/MJ tags that add little for a modern Chinese-native model and dilute meaningful tokens.","Don't push skin 'perfection' language too hard ('完美无瑕的肌肤') — it triggers over-smoothing and the plastic/AI-skin look. Prefer concrete texture language ('带细微毛孔的真实皮肤').","Don't expect perfect long-form text rendering — keep in-image Chinese short (a few characters), verify the output, and re-roll garbled glyphs rather than over-specifying.","Don't rewrite a winning prompt wholesale when iterating — change ONE variable (lighting OR color OR lens) per variation so you can attribute the effect, and lock the seed to isolate that change.","Don't ignore the aspect ratio — it reshapes composition and cropping, so specify placement/负空间 with the target frame (e.g. 16:9 vs 9:16) in mind.","Don't split a complex scene across multiple co-equal focal points in one prompt; that over-stuffs and confuses the model. Build the scene around ONE clear subject first."],"dos":["Write in fluent, coherent Chinese descriptive sentences — treat prompt-writing like describing a single film frame in a novel, not like tagging.","Lead with the subject (who/what, with specifics: garment, color, action), then layer composition, lighting, color, texture, mood, and ONE dominant style.","Use concrete photographic language: name focal lengths (85mm人像, 35mm广角), light setups (侧逆光, 黄金时刻, 柔和窗光, 体积光), depth-of-field (浅景深), and explicit color palettes (青橙色调, 低饱和).","Keep exactly ONE dominant style per prompt (photo-real OR illustration OR 水彩 OR 油画); other terms should modify that style, not compete with it.","Add a short, specific negative-prompt list (排除词) to suppress common drift: extra/merged fingers and limbs, garbled or extra text, watermarks and logos, blur, deformity, plastic skin.","Place and count elements concretely ('三只红灯笼挂在屋檐下', '傍晚的光线') rather than using vague quantities.","For Chinese text inside the image, keep it short, put the exact characters in the prompt, and always verify the rendered output — re-roll if glyphs deform.","When iterating, change ONE variable at a time and lock the seed so you can attribute each effect and reproduce good compositions.","Match composition language to your chosen aspect ratio (use 16:9/21:9 negative space language, 9:16 vertical framing, etc.) to avoid unwanted cropping of the subject."],"key_findings":["PROMPT LANGUAGE — DESCRIPTIVE CHINESE PROSE, NOT TOKEN PILES. The single most important Jimeng/Seedream methodological point, and the sharpest contrast with Midjourney: Seedream was trained as a Chinese-native model and is engineered to parse fluent natural-language Chinese. The optimal prompt is a coherent scene description — the way you would write one shot in a novel or a film treatment — not a comma-separated dump of tags. Compare a weak tag pile ('少女, 汉服, 樱花, 古风, 8k, 杰作, 电影感') with a strong prose prompt: '一位身着月白色汉服的少女站在盛开的樱花树下，微风轻拂发丝，侧逆光勾勒出柔和的面部轮廓，浅景深虚化背景，淡粉与青灰的低饱和色调，整体呈现温润清雅的东方古典氛围，照片级写实风格，皮肤纹理细腻真实。' The second is what Seedream rewards: every dimension specified, ONE dominant style, grammatical flow the model can read as a unified semantic. English token-style prompting is the #1 reason Western users under-perform on Jimeng.","STRUCTURE — THE NINE-PART FORMULA WOVEN INTO ONE SENTENCE. A great prompt covers, in roughly this order: 主体 (subject — lead with this, with concrete specifics like garment/color/action) → 构图 (composition/framing/negative space) → 镜头/焦段 (lens: 85mm人像, 35mm广角, 浅景深, f/1.4) → 光影 (lighting: 黄金时刻, 侧逆光, 柔和窗光, 体积光) → 色调 (color palette: 青橙色调, 低饱和, 电影感青绿) → 材质/纹理 (material/texture: 皮肤毛孔, 织物, 湿润光泽) → 氛围 (mood) → 风格 (style) → 质量修饰 (quality). The discipline is not to fill every slot mechanically but to make sure nothing important is left to the model's default — and to weave them into one sentence rather than a list. Lead-with-subject matters both for clear writing and because it sets the model's primary attention early.","LENGTH — SPECIFICITY WINS, NOT WORD COUNT. Seedream does not reward length for its own sake; it rewards specificity and coherence. A good Chinese prompt is typically a 1–3 sentence description (roughly 50–200 characters for most scenes, more for complex multi-element compositions). Too short and the model fills gaps with generic defaults (you lose control of lighting, palette, framing); too long and over-stuffed and you dilute focus and invite contradiction, which diffusion models resolve as blur or visual chaos. Prefer one concrete, well-specified scene over five loosely-connected ideas in one prompt. If you need a second idea, generate it separately.","THE ONE-DOMINANT-STYLE RULE (BIGGEST BEGINNER FAILURE). Pick exactly ONE dominant style per generation: either photorealistic, OR watercolor, OR 3D render, OR oil painting, OR 国风插画 — never co-equal stacks like '照片级真实 + 水彩 + 3D渲染 + 油画'. Sub-attributes can modify the dominant style ('照片级写实，带有油画质感的光影' is fine, because lighting is subordinate), but two co-equal styles get averaged into a muddy, indecisive image. This is universal diffusion wisdom but bites especially hard on a high-fidelity model like Seedream where the conflict shows up as visible blur, plastic textures, or compositional chaos.","QUALITY MODIFIERS — CONCRETE BEATS BUZZWORDS. Modifiers that actually move the output address a specific dimension the model can act on: lighting ('黄金时刻的侧逆光', '体积光穿过窗帘'), lens/depth ('85mm人像镜头，浅景深'), texture ('可见的皮肤毛孔与细小绒毛', '织物纹理清晰'), color grade ('青橙电影色调', '低饱和高对比'). Modifiers that are mostly empty calories on a modern model: '8k, masterpiece, best quality, 杰作, 顶级画质, 超高清'. These are leftover Stable Diffusion / Midjourney tags; Seedream is already biased toward high quality so they add little signal and mostly dilute the meaningful tokens. A mild '高质量、细节丰富' does no harm, but don't mistake buzzword-stuffing for prompt engineering. (Confidence that English 8k/masterpiece tags are near-noise on Seedream: medium-high; the odd Chinese '高清' may give a faint nudge, but concrete terms always dominate.)","SEEDREAM-SPECIFIC STRENGTHS TO LEAN INTO. (1) Chinese text rendering inside images is genuinely strong — you can ask for 招牌/海报/题字 with actual characters and get legible output far more reliably than Western models, though long strings and rare/complex characters still drift, so keep in-image text short and always verify. (2) Photorealism, especially skin, eyes, hair, fabric, food — among the best; lean on this rather than fighting it. (3) Reference-image / 图生图 workflow: upload references for character or style consistency and use the regeneration-strength (重绘幅度) control — high strength deviates more from the reference, low strength stays closer. For keeping a character consistent across shots, reference image + moderate strength beats long verbal description. (4) Multi-image fusion — combining multiple references (e.g. a pose ref + a style ref) — is a Seedream differentiator. (5) Chinese aesthetics: 国风/古风/东方古典, Chinese urban scenes, 中国节庆 imagery are home turf; the model's defaults and training skew here, so you need fewer style tokens to land them than a Western model would. (Exact UI field names like '重绘幅度' and the precise multi-image fusion controls evolve between releases — the concepts are stable, verify current labels in-app.","JIMENG vs MIDJOURNEY — THE OPERATING MODEL DIFFERENCE. Midjourney is optimized for English, comma-separated tags, and parameter flags (--ar, --no, --cref, --sref); its aesthetic default skews Western/illustration/gallery. Jimeng/Seedream is optimized for Chinese prose, exposes aspect ratio and negatives through GUI fields rather than CLI flags, has reference-image upload as a first-class workflow, and its aesthetic default is more photorealistic and China-native. Practical consequence: do not port a Midjourney prompt directly. Translate the intent into a Chinese descriptive paragraph, move '--ar 16:9' to the aspect selector, move '--no watermark' to 排除词, and move '--cref' to the 图生图 reference slot. Same underlying image-gen principles; different input grammar.","DRIFT RISKS & MITIGATIONS. Universal diffusion failures still apply to Seedream: extra/merged fingers and limbs (worsened when hands are weight-bearing or interacting with objects), garbled text (worse on long or non-Chinese strings), over-smoothed/plastic skin (worsened by stacking '完美肌肤' type terms — prefer '真实皮肤纹理，带细微毛孔'), and watermark/logo artifacts (the model sometimes invents fake watermarks; suppress with 排除词). Two mitigations do most of the work: (a) a standard negative-prompt block targeting 多余的手指/肢体、错误或多余的文字、水印、模糊、变形, and (b) keeping the positive prompt coherent and uncontradictory so the model isn't pushed toward chaos. Re-rolling with a locked seed while changing one variable at a time is the fastest path to a fix — don't rewrite the whole prompt blind."],"platform_tips":["Jimeng/Seedream is Chinese-native: write prompts as fluent Chinese descriptive sentences. This single shift matters more than any other tactic — it's why Western/Midjourney habits under-perform here.","Use the 图生图 (reference-image) upload for character/style consistency instead of trying to describe a face or style in words — pair it with the 重绘幅度/strength control (low = closer to reference, high = more deviation).","Keep a standing 排除词 (negative prompt): 多余的手指/肢体, 错误或多余的文字, 水印, 标志, 模糊, 变形, 塑料感皮肤 — this neutralizes most common drift in one move.","For Chinese text inside images, keep it short, quote the exact characters in the prompt, and verify — Seedream is strong but long/rare characters still drift.","Pick ONE dominant style per image and let other terms modify it (lighting, mood), never stack co-equal styles (photo + watercolor + 3D) — that produces blur and chaos on a high-fidelity model.","Skip the English buzzword tags (8k, masterpiece, best quality). Replace with concrete photographic language: named focal lengths, named lighting setups, explicit color grades, named textures.","Lead the sentence with the subject and its specifics; place background and supporting elements after — clearer for the model and better composition.","Use the aspect-ratio selector deliberately: match your composition language to the frame (16:9 negative space, 9:16 vertical, etc.) to avoid the subject getting cropped.","Lock the seed when you get a composition you like, then change one variable per re-roll — this is the fastest way to converge and to learn what each lever does.","Lean into Seedream's home turf — 国风/古风/中国节庆/中式城市/东方美学 need fewer style tokens to land than on Western models; let the model's defaults work for you.","Confidence flags: stable/high-confidence = Chinese-prose prompting, one-dominant-style rule, concrete-vs-buzzword modifiers, negative-prompt mitigations, reference-image workflow concept. Medium/evolving = exact UI field names (排除词/图生图/重绘幅度), exact Seedream 4.x version features, precise multi-image fusion mechanics — concepts are solid, verify current labels in-app."]};

const ANTI = {"donts":["不要堆叠相互冲突的风格词(摄影写实+油画+水彩+3D+赛博朋克并列)——必出模糊/撕裂废图。","不要像 Midjourney 那样写一串逗号分隔的英文标签;即梦吃不通顺的中文描述句。","不要在一个画面里塞过多主体/道具(五人+桌子+花瓶+猫+雪山+墙画+地毯)——注意力被稀释,每个元素都半成品。","不要单独靠'美/好看/高质量/杰作/award-winning'这类空泛词撑画面,它们不携带可渲染信息。","不要把手藏在背后或物体后面——遮挡会被模型自行脑补成畸形手;要么明确描述手部动作,要么让它简单完整可见。","不要要求长文、艺术字、或曲面(瓶身/布料褶皱)上的文字;需要时用短词+平面载体+标准字体。","不要提品牌名、'图库照/官方图/高清壁纸'——这些词触发 logo 与半透明水印复现。","不要同时写多个光源方向(侧光+逆光+顶光+霓虹)——光影打架,阴影矛盾,整体发灰。","不要把头顶、脚底、手指、手肘顶在画框边缘——比例不适配时直接被裁。","不要堆'完美/无瑕/光滑/细腻皮肤'+ '8K' 这类词——模型审美偏向无瑕,叠加后产出蜡人/瓷娃娃。","不要让多个人物身体重叠——极易出现肢体粘连、fused body。人群控制在 3 人以内且不重叠。","不要指望一张图一次性满足所有需求;复杂场景、多元素合成请分层迭代(图生图叠加)。","不要把希望全押在质量词(8K/超高清/极致细节)上——对 Seedream 这类已调优模型边际收益低,反而挤占有效 token、推塑料感与过锐。"],"dos":["用通顺连贯的中文白话句子写提示词——即梦母语是中文描述,不是 MJ 式逗号 token。","一张图只定一个主导风格;要融合时写成'以摄影写实为主,略带油画质感'的主+辅结构,绝不并列平铺。","按'主体→构图→镜头/焦段→光影→色调→材质→氛围→风格→质量'的顺序组织一段连贯描述。","主体要具体可渲染:身份/年龄/服饰/姿势/表情/朝向都说清,而不是笼统的'一个女孩'。","指定一个主光源 + 明确方向 + 光质(如左侧窗户柔和自然光斜照、顶部漫射柔光),需要补光写'轻微右侧反光'。","给出明确配色:一个主色 + 一个点缀色 + 冷暖调(如暖色调,主色橙黄,点缀深蓝),避免模型自由发灰。","按主体选比例:全身人像 9:16 或 3:4 竖图,头像特写 1:1,风光/合影 16:9 或 3:2 横图,并在文字里点明'全身入镜'。","让手部简单且完整可见,或明确描述其动作(如双手自然交叠于膝上),避免手被遮挡或在画框边缘。","需要中文文字时,用引号写明确切短字(≤6 字),指定标准字体(黑体/宋体)+ 平面载体(招牌/纸面/墙);Seedream 中文渲染是相对强项。","用参考图(图生图)做角色/场景一致性——这是 Seedream 的强项,远比纯文字反复抽卡稳定。","用排除词(负面提示)反向雕刻,主动剔除高频失败模式(见 universal_negatives);每个失败模式都有对应的负面词。","一个画面只聚焦一个主角 + 一个焦点道具,其余元素降级为氛围/背景(如简洁的室内,窗外隐约可见雪山)。","复杂需求分层迭代:先出主体定稿,再图生图补背景/细节/文字,不要一张图塞到底。"],"drift_risks":[{"fix":"负面词加'多余的手指,变形的手,六指,断指,手指粘连,多余的肢体,肢体融合'。措辞上让手保持简单且完整可见(如双手自然垂于身侧、右手轻握茶杯),避免手被遮挡或在画框边缘被裁;避免人物身体重叠的多人合照(≤3 人);手部关键时改用图生图提供参考手势。","risk":"人物手部、手指、肢体重复或融合——多一根手指、手背长出肢体、群体照里两人身体粘连。手部是高频细节且拓扑学上不稳定,几乎所有全身/半身人像都会受影响,是出图废片率最高的单一原因。","severity":"high"},{"fix":"一张图只保留一个主导风格。要融合时写成'以摄影写实为主,略带油画质感'这种主+辅结构,绝不平铺并列。负面词加'风格混乱,质感冲突,模糊'。","risk":"同一提示词里堆叠'摄影真实 + 油画 + 水彩 + 3D 渲染 + 赛博朋克'等相互冲突的风格,模型在多个梯度间平均,产出模糊、混沌、风格撕裂的废图,皮肤呈油画塑料感。","severity":"high"},{"fix":"只保留一个主角 + 一个焦点道具,其余降级为氛围/背景(如简洁的室内,窗外隐约可见雪山)。需要复杂场景时分层生成:先出主体,再图生图补细节。砍掉冗余的质量词(见第14条)。","risk":"一个画面塞进过多主体/道具/细节(五个人+桌子+花瓶+猫+窗外雪山 // ---- helpers ----
function fillDimSelect(sel,arr){arr.forEach(x=>{const o=document.createElement('option');o.value=x.id;o.textContent=x.label_cn;sel.appendChild(o);});}
function phrase(arr,id){const o=arr.find(x=>x.id===id);return o?o.phrase_cn:'';}
function fillTemplate(tpl,vars){return tpl.replace(/\{(\w+)\}/g,(m,k)=>(vars[k]!==undefined&&vars[k]!=='')?vars[k]:m);}
function setOut(k,v){document.getElementById('out-'+k).textContent=v;}

// ---- build selects ----
function buildSelects(){
  STYLES.forEach(s=>{const o=document.createElement('option');o.value=s.id;o.textContent=s.name_cn+' · '+s.category;styleSelect.appendChild(o);});
  fillDimSelect(compSelect,DIM.composition);
  fillDimSelect(lensSelect,DIM.lens);
  fillDimSelect(lightSelect,DIM.lighting);
  fillDimSelect(colorSelect,DIM.color);
  ASPECTS.forEach(a=>{const o=document.createElement('option');o.value=a;o.textContent=a;aspectSelect.appendChild(o);});
}

// ---- build preset buttons ----
function buildPresets(){
  const wrap=document.getElementById('presets');
  PRESETS.forEach(p=>{
    const b=document.createElement('button');
    b.type='button';b.className='preset-btn';b.textContent=p.label;b.dataset.id=p.id;
    b.addEventListener('click',()=>{
      applyStyle(p.id,{clearSubject:true});
      document.querySelectorAll('.preset-btn').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      generate();
    });
    wrap.appendChild(b);
  });
}

// ---- apply a style: fill subject example, aspect, negatives, dim defaults ----
function applyStyle(sid,opts){
  const style=STYLES.find(s=>s.id===sid);
  if(!style) return;
  styleSelect.value=sid;
  const curSubj=subjectInput.value.trim();
  const subjIsExample=STYLES.some(s=>s.default_subject_example===curSubj);
  if(opts&&opts.clearSubject){subjectInput.value='';}
  else if(!curSubj||subjIsExample){subjectInput.value=style.default_subject_example;}
  aspectSelect.value=style.recommended_aspect;
  const curNeg=negativesInput.value.trim();
  const negIsDefault=STYLES.some(s=>s.negatives.join('、')===curNeg);
  if(!curNeg||negIsDefault){negativesInput.value=style.negatives.join('、');}
  const d=STYLE_DIM_DEFAULTS[sid]||{};
  if(d.composition)compSelect.value=d.composition;
  if(d.lens)lensSelect.value=d.lens;
  if(d.lighting)lightSelect.value=d.lighting;
  if(d.color)colorSelect.value=d.color;
  moodInput.value='';
}

// ---- generate all 5 outputs ----
function generate(){
  const sid=styleSelect.value;
  const style=STYLES.find(s=>s.id===sid);
  if(!style) return;
  const subject=subjectInput.value.trim()?subjectInput.value.trim():style.default_subject_example;
  const compId=compSelect.value, lensId=lensSelect.value, lightId=lightSelect.value, colorId=colorSelect.value;
  const composition=phrase(DIM.composition,compId);
  const lens=phrase(DIM.lens,lensId);
  const lighting=phrase(DIM.lighting,lightId);
  const color=phrase(DIM.color,colorId);
  const mood=moodInput.value.trim()?moodInput.value.trim():(STYLE_MOOD[style.id]||'自然真实的氛围');
  const aspect=aspectSelect.value;

  // 1 中文提示词
  const cn=fillTemplate(style.prompt_template_cn,{subject:subject,composition:composition,lens:lens,lighting:lighting,color:color,mood:mood});

  // 2 负向提示词 (style negatives already in box + universal, dedup)
  const negArr=negativesInput.value.split(/[\n、,，]/).map(s=>s.trim()).filter(Boolean);
  const merged=[...new Set([...negArr,...ANTI.universal_negatives])];
  const neg=merged.join('、');

  // 3 英文关键词
  const enKW=[...style.keywords_en];
  if(DIM_EN.composition[compId])enKW.push(DIM_EN.composition[compId]);
  if(DIM_EN.lens[lensId])enKW.push(DIM_EN.lens[lensId]);
  if(DIM_EN.lighting[lightId])enKW.push(DIM_EN.lighting[lightId]);
  if(DIM_EN.color[colorId])enKW.push(DIM_EN.color[colorId]);
  enKW.push('aspect ratio '+aspect.replace(':',' to '));
  const en=[...new Set(enKW)].join(', ');

  // 4 参数建议
  const tipIdx=[0,2,4,7];
  const tips=tipIdx.map(i=>PLATFORM.platform_tips[i]).filter(Boolean);
  const param='比例：'+aspect+'\n'+tips.map(t=>'• '+t).join('\n');

  // 5 防漂移清单 + 即梦技巧
  const driftLines=style.drift_risks.map(d=>'['+d.severity+'] '+d.risk+'\n   → '+d.fix);
  const rules=[
    '① 即梦吃中文自然语言，写成一整段描述，别堆冲突风格词',
    '② 一张图只锁一个主风格',
    '③ 手 / 脚 / 文字易崩，用负向词 + 重抽',
    '④ 主体要具体（谁 / 穿什么 / 在哪 / 做什么）',
    '⑤ 负向词放"排除"框',
    '⑥ 抽 4–8 张挑最稳的'
  ];
  const drift=driftLines.join('\n')+'\n\n—— 即梦通用技巧 ——\n'+rules.join('\n');

  setOut('cn',cn);setOut('neg',neg);setOut('en',en);setOut('param',param);setOut('drift',drift);
  LAST={cn:cn,neg:neg,en:en,param:param,drift:drift};
}

// ---- copy with file:// fallback ----
function flash(btn){
  if(!btn)return;
  if(btn.dataset.orig===undefined)btn.dataset.orig=btn.textContent;
  btn.textContent='已复制';
  btn.classList.add('copied');
  clearTimeout(btn._t);
  btn._t=setTimeout(()=>{btn.textContent=btn.dataset.orig;btn.classList.remove('copied');},1200);
}
function fallbackCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text;ta.style.position='fixed';ta.style.top='-1000px';ta.style.left='0';
  ta.setAttribute('readonly','');
  document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand('copy');}catch(e){}
  document.body.removeChild(ta);
}
function copyText(text,btn){
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(text).then(()=>flash(btn)).catch(()=>{fallbackCopy(text);flash(btn);});
  }else{
    fallbackCopy(text);flash(btn);
  }
}

// ---- wire up ----
function init(){
  buildSelects();
  buildPresets();
  applyStyle('portrait-photo');
  generate();

  styleSelect.addEventListener('change',()=>{
    applyStyle(styleSelect.value);
    document.querySelectorAll('.preset-btn').forEach(x=>x.classList.remove('active'));
    generate();
  });
  [subjectInput,moodInput,negativesInput].forEach(el=>el.addEventListener('input',generate));
  [compSelect,lensSelect,lightSelect,colorSelect,aspectSelect].forEach(el=>el.addEventListener('change',generate));
  document.getElementById('genBtn').addEventListener('click',generate);

  document.querySelectorAll('.copy-btn').forEach(b=>{
    b.addEventListener('click',()=>copyText(LAST[b.dataset.k]||'',b));
  });
  document.getElementById('copyAll').addEventListener('click',function(){
    const text=['cn','neg','en','param','drift'].map(k=>'【'+OUT_TITLES[k]+'】\n'+(LAST[k]||'')).join('\n\n');
    copyText(text,this);
  });
}
init();
