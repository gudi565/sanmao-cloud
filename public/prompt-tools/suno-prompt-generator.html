turns)\n\n[Verse 2]\nKeys in your jacket, the taxi\nYou lean in and say my name\nI'm losing the line of the story\nI don't even care what we came for\n\n[Pre-Chorus]\nAnd the lights go down, down, down\nEvery move you make is loud\n\n[Chorus]\nWe don't need a reason, we just keep on dancing\nHeart on the ceiling, gold on the feeling\nWe don't need a reason, we just keep on—\n\n[Bridge]\nStrip it back, just the kick and your hand on my waist\nDon't let the night go to waste\n\n[Chorus]\nWe don't need a reason, we just keep on dancing\nHeart on the ceiling, gold on the feeling\nWe don't need a reason\n\n[Outro]\n(pluck hook, filter down, vocal chop fades)\nkeep on, keep on—",segments:[{segment:"Intro",prompt:"4-bar intro: signature ear-candy pluck motif + light four-on-the-floor kick + filtered pad rising in. Establish the hook immediately — no long build."},{segment:"Verse 1",prompt:"Strip texture back to kick, syncopated bass, and a clean guitar stab. Vocal forward and conversational. Keep sparse so the chorus can bloom."},{segment:"Pre-Chorus",prompt:"Add rising synth pad and a filter sweep lifting the vocal. Energy rises through texture — no snare roll, no riser."},{segment:"Chorus",prompt:"Full texture: punchy drums, layered backing vocals, ear-candy pluck, bass wide. Hook melody front and center. Warm bloom, not a drop."},{segment:"Verse 2",prompt:"Return to sparser groove; introduce a new percussive ear-candy element (shaker, rim) to keep it fresh without a build."},{segment:"Bridge",prompt:"Drop to pads and a single vocal line; half-time feel. Contrast before the final chorus — texture shift, not a riser."},{segment:"Chorus",prompt:"Maximum layering, stacked BVs, widest stereo image. End on the hook motif, not on a belted high note."},{segment:"Outro",prompt:"Filter the mix down over 4 bars; end on the signature pluck and a vocal chop."}],drift_risks:[{risk:"Anonymous royalty-free pop with no signature ear-candy hook — the risk is indistinguishability from stock library music.",severity:"HIGH",fix:"Name one specific signature sound (a particular pluck, vocal chop, or guitar stab) in the prompt and force it into the intro and chorus; cite a specific {refs} production trait rather than generic 'pop'; avoid bare trigger words."},{risk:"EDM festival supersaw drop erupts in the chorus where a pop bloom should be.",severity:"HIGH",fix:"Replace any 'drop/build/anthemic' language with 'bloom through layered vocals' and 'lift through filter sweep'; explicitly exclude 'supersaw, festival drop, riser'; keep energy groove-driven."},{risk:"Trap hi-hat rolls and 808 sub-bass sneak into the percussion and low end.",severity:"MEDIUM",fix:"Explicitly exclude 'trap hats, 808 sub-bass'; specify 'acoustic-feel snare, electric bass guitar, clean low end'."},{risk:"Diva belting / oversung chorus oversells the hook.",severity:"MEDIUM",fix:"Specify 'controlled mixed-voice, conversational dynamics, restraint in verses'; cap melisma and note the chorus lifts via stacking not volume."},{risk:"Snare-roll and white-noise riser buildups appear between sections.",severity:"LOW",fix:"Exclude 'snare roll, white-noise riser'; specify 'transitions via filter and texture only'."}],dos:["Front-load the hook in the first 10-15 seconds — pop fails if the opener is weak.","Layer 3-4 backing vocal stacks in the chorus to widen and lift.","Contrast sparse verses against full choruses using texture dynamics, not volume builds.","Name one concrete signature ear-candy sound and reuse it in both the intro and the chorus.","Generate 6-8 takes; the first 1-2 are diagnostic and usually discarded."],donts:["Don't leave the lyrics field empty — Suno auto-writes narrative pop lyrics that destroy the vibe.","Don't use the words 'drop,' 'build,' 'peak,' or 'anthemic' — they prime EDM drops and diva belting even when negated.","Don't push BPM outside 95-128 — outside this it stops reading as radio pop.","Don't stack more than ~200 characters of style tags — Suno truncates the rest and weights earlier tokens more."]},
{id:"rnb-soul",name:"R&B / Soul",bpm_range:"60-95",default_bpm:82,default_key:"D minor",default_vocal:"expressive soulful lead, female, breathy-to-belt dynamic, melismatic, close-mic intimacy",style_tags:"contemporary R&B, neo-soul, warm Rhodes, deep pocket bass, live drums with ghost notes, muted guitar chops, tape warmth, gospel-tinged, no trap hats, no EDM drop, no hard-tune",prompt_body:"Warm, intimate {mood} contemporary R&B / neo-soul at {bpm} BPM in {key}, styled after {refs}. The track sits in a deep pocket: a warm Rhodes or Wurlitzer electric piano carries the harmony, a round melodic electric bass locks with a live-feel drum groove — brushed snare, ghost-note grace, a slight behind-the-beat push. Muted guitar chops and a soft sub beneath the bass give body. Lush, gospel-tinged backing vocal harmonies swell in the chorus; everything is draped in tape warmth and gentle compression. The groove is king: it never rushes, never loosens into lo-fi laziness — it stays tight and in the pocket.\n\n{vocal}: a close-mic, expressive soulful lead with a breathy low register that opens into a controlled belt, melismatic runs used as color rather than display. Natural tuning, organic, intimate — phrasing behind the beat. Restrained in verses, expressive (not showy) in choruses.\n\nEXCLUSIONS — no trap hi-hats or hard-tuned auto-tune lead, no EDM drops, no lo-fi hip-hop dust or chillhop muzak, no acoustic singer-songwriter solo sparseness, no pop-diva belting or oversinging, no boom-bap drums. Energy advances by harmony, vocal layering, and groove deepening — never by a build-and-drop.",references:["SZA","Frank Ocean","H.E.R.","Daniel Caesar"],lyric_scaffold:"[Intro]\n(Rhodes + soft sub, 4 bars, vinyl-free)\n\n[Verse 1]\n3 AM, your t-shirt, bare feet on the floor\nYou trace the freckles like you're reading a map\nI'm trying to stay, I'm trying to go\n(run) mm, you already know\n\n[Pre-Chorus]\nAnd the room goes soft, soft, soft\nEvery breath you take is a song\n(BVs enter)\n\n[Chorus]\nSo stay a little longer, a little deeper\nI'm not asking for forever, just the morning\nStay, stay, stay\n(harmony stack) let the hours slip away\n\n[Verse 2]\nCoffee gone cold on the nightstand\nYour laugh in the dark like a melody\nI'm losing the line, losing control\n(run) come a little closer to me\n\n[Pre-Chorus]\nAnd the room goes soft, soft, soft\nEvery breath you take is a song\n\n[Chorus]\nSo stay a little longer, a little deeper\nI'm not asking for forever, just the morning\nStay, stay, stay\nlet the hours slip away\n\n[Bridge]\n(gospel breakdown — Rhodes + vocal only)\nIf this is all we get\n(build bar by bar)\nthen I don't need the rest\n(run peaks)\n\n[Chorus]\nStay a little longer, a little deeper\nI'm not asking for forever, just the morning\nStay, stay, stay\n(harmonies peak) let the hours slip away\n\n[Outro]\n(vamp over Rhodes, ad-libs fading)\nstay... just the morning...\n(breath out)",segments:[{segment:"Intro",prompt:"4-bar Rhodes intro with soft sub-bass and a muted guitar chop; the groove establishes immediately — no long pad drone."},{segment:"Verse 1",prompt:"Bass + Rhodes + brushed drum groove; vocal close and breathy, behind the beat. Bass walks, pocket locked."},{segment:"Pre-Chorus",prompt:"Backing vocals enter, harmony thickens; filter opens slightly; groove tightens toward the chorus without a riser."},{segment:"Chorus",prompt:"Full pocket: deep bass, lush BV stacks, guitar chops, Rhodes wide. Warm bloom, not a drop."},{segment:"Verse 2",prompt:"Return to intimate trio; introduce a subtle strings or pad layer for evolution. Pocket never loosens."},{segment:"Bridge",prompt:"Gospel breakdown — strip to Rhodes and a single vocal; harmonies build bar by bar; a melismatic run peaks."},{segment:"Chorus",prompt:"Maximum warmth and harmony; bass deepest; BVs at their widest. End on the hook resolve."},{segment:"Outro",prompt:"Vamp over the Rhodes groove; ad-libs and runs fade over the pocket."}],drift_risks:[{risk:"Hard-tuned auto-tune trap-adjacent vocal — modern R&B drifts toward trap-pop.",severity:"HIGH",fix:"Specify 'natural tuning, organic, subtle pitch correction'; explicitly exclude 'trap hats, hard-tune auto-tune lead, 808'; keep the groove live-feel and behind the beat."},{risk:"Lo-fi hip-hop dust / chillhop muzak — the dusty drums and tape read as lo-fi.",severity:"HIGH",fix:"Keep the groove tight and in pocket, not lazy; add live-feel swing and ghost notes; specify 'polished neo-soul, not lo-fi'; exclude 'lo-fi, chillhop, vinyl crackle.'"},{risk:"Acoustic singer-songwriter intimacy makes the track too sparse and loses the groove.",severity:"MEDIUM",fix:"Keep bass + Rhodes + drums present in every section; specify 'full trio pocket, not acoustic solo.'"},{risk:"Pop-diva belting / oversinging in the chorus oversells the emotion.",severity:"MEDIUM",fix:"Specify restraint, 'breathy-to-belt within a phrase,' 'runs as color not display'; cap the belt and keep verses intimate."},{risk:"EDM drop appears in the chorus where a warm bloom belongs.",severity:"LOW",fix:"Describe chorus energy as 'groove deepening and harmony layering'; exclude 'drop, riser.'"}],dos:["Keep the bass locked to the drum groove in a deep pocket — the pocket is the whole genre.","Use close-mic intimacy and breath as texture; let the lead sit right in front of the listener.","Layer gospel-tinged backing vocals in the chorus to add warmth and width.","Let energy advance by harmony and vocal layering, never by build-and-drop.","Generate 6-8 takes — pocket placement and tuning vary widely take to take."],donts:["Don't leave lyrics empty — provide emotional, image-based, repetitive scaffolds with explicit run/ad-lib cues.","Don't use 'drop,' 'build,' or 'anthemic' — they prime EDM and diva belting.","Don't add trap hats, hard-tune, or 808s — that flips the genre to trap-pop.","Don't let the groove loosen into lo-fi laziness — keep it tight, behind-but-not-late."]},
{id:"indie-rock",name:"Indie Rock / Alternative",bpm_range:"110-150",default_bpm:128,default_key:"A major",default_vocal:"indie rock lead, male, slightly raspy, earnest and detached, double-tracked in choruses",style_tags:"indie rock, jangle-pop guitars, tube-amp edge-of-breakup, melodic driving bass, ride-cymbal groove, roomy live drums, vintage console, garage edge, no trap hats, no EDM drop",prompt_body:"Driving, {mood} indie rock at {bpm} BPM in {key}, styled after {refs}. Two guitars: one clean jangle (Rickenbacker-style open chords) and one pushing a tube amp to the edge of breakup — fuzz and chime, never metal gain. A melodic, driving bassline locks with a roomy, live-feel drum kit riding the cymbal for forward motion. The vocal is soaked in spring reverb, slightly detached and earnest; choruses open up with double-tracked leads and a wider stereo field. Production is vintage-console warm — imperfections are kept, the room is part of the sound. Energy comes from the ride cymbal and bass driving forward, not from a build.\n\n{vocal}: an earnest indie-rock lead, slightly raspy, phrased a touch behind the beat, detached rather than theatrical, double-tracked and widened in choruses. Controlled range — no stadium belting, no pop-punk whine.\n\nEXCLUSIONS — no metal/hard-rock palm-muted chugging or high-gain guitars, no Max-Martin pop polish or pitch-perfect sheen, no trap beats or 808s, no EDM drops or synths, no pop-punk nasality, no stadium anthemic belting. Guitars stay at jangle-to-fuzz gain, open chords, not chugs.",references:["Arctic Monkeys","The Strokes","Tame Impala","Cage the Elephant"],lyric_scaffold:"[Intro]\n(jangle guitar riff, 4 bars, drums enter last bar)\n\n[Verse 1]\nBorrowed coat and a borrowed name\nYou were smoking in the stairwell, said it wasn't the same\nI believed you, I believed you then\nHalf a joke and half a dare\n\n[Chorus]\nWe don't go back to the old lights\nWe don't go back to the high\n(double-tracked) running down the avenue\njust me and the noise and you\n\n[Verse 2]\nDiner at 2, your headphones loud\nYou were humming something I never allowed\nI remember, I remember it wrong\nBut the verse still plays along\n\n[Chorus]\nWe don't go back to the old lights\nWe don't go back to the high\nrunning down the avenue\njust me and the noise and you\n\n[Bridge]\n(half-time, sparse, near-whisper)\nIf you're listening at all\nI left the window open\n(guitar solo enters)\n\n[Guitar Solo]\n[Instrumental over verse chords, fuzz lead, 8 bars]\n\n[Chorus]\nWe don't go back to the old lights\nWe don't go back to the high\n(fullest texture) running down the avenue\njust me and the noise and you\n\n[Outro]\n(riff repeats, ride-out, feedback fade)\njust me and the noise and you",segments:[{segment:"Intro",prompt:"4-bar jangle guitar riff; full band enters in the last bar with a ride-cymbal crash. Establish the riff as the identity."},{segment:"Verse 1",prompt:"Bass + drums + clean jangle guitar; vocal upfront, slightly detached. Ride cymbal keeps forward motion."},{segment:"Chorus",prompt:"Fuzz guitar enters, vocal double-tracked and widened, stereo field opens. Lift by texture and layering, not a drop."},{segment:"Verse 2",prompt:"Drop back to verse texture; add a second guitar countermelody to keep it fresh without a build."},{segment:"Bridge",prompt:"Half-time feel, sparse, contrasting; vocal drops to a near-whisper before the solo."},{segment:"Guitar Solo",prompt:"Instrumental fuzz solo over verse chords — melodic, not shred; tone at edge of breakup."},{segment:"Chorus",prompt:"Fullest texture: both guitars, widest stereo, cymbals driving. End on the riff, not a belted note."},{segment:"Outro",prompt:"Riff repeats with variations; ride-out to feedback fade."}],drift_risks:[{risk:"Pop-punk / emo nasality creeps into the vocal — indie rock drifts toward whiny pop-punk.",severity:"HIGH",fix:"Specify 'detached, understated phrasing, behind the beat, not whiny'; cite a {refs} vocal; explicitly exclude 'pop-punk, emo, nasality.'"},{risk:"Guitars tip into metal / hard-rock palm-muted chugging.",severity:"HIGH",fix:"Specify 'tube amp at edge of breakup, jangle-to-fuzz, open chords, not palm-muted chugs'; name a fuzz type (Tone Bender / Fuzz Face); exclude 'metal, high-gain, djent, palm-mute.'"},{risk:"Polished Max-Martin pop sheen over-produces the grit out of the track.",severity:"MEDIUM",fix:"Specify 'vintage console, live room, imperfections kept, room-mic drums'; exclude 'pitch-perfect, polished pop, quantized.'"},{risk:"Singer-songwriter acoustic drift makes it too sparse and loses the band drive.",severity:"MEDIUM",fix:"Keep the full four-piece driving in every section; maintain ride-cymbal motion throughout; specify 'band driving, not solo acoustic.'"},{risk:"Stadium anthemic belting inflates the chorus.",severity:"LOW",fix:"Specify restraint and 'Strokes-style phrasing'; cap dynamic range; exclude 'anthemic, arena, belting.'"}],dos:["Establish the guitar riff as the track's identity in the first 4 bars.","Keep two guitars in contrast — one clean jangle, one fuzz — throughout.","Use double-tracked vocals and a wider stereo field to lift choruses by texture.","Let the ride cymbal and melodic bass drive the energy forward, not volume builds.","Generate 6-8 takes; guitar tone and vocal character vary considerably."],donts:["Don't leave lyrics empty — give narrative, image-heavy, half-spoken scaffolds with an [Instrumental] solo marker.","Don't use 'anthemic,' 'arena,' 'epic,' or 'massive' — they prime stadium belting and high-gain guitars.","Don't push guitar gain past edge-of-breakup — it becomes hard rock/metal fast.","Don't over-polish — the room sound and the imperfections are the genre."]},
{id:"trap-hiphop",name:"Trap / Hip-hop",bpm_range:"130-160",default_bpm:140,default_key:"F# minor",default_vocal:"trap rap lead, male, triplet flow, auto-tuned melodic hooks, stacked ad-libs",style_tags:"trap, deep 808 bass with glide, rolling triplet hi-hats, dark minor pads, cinematic brass stabs, punchy kick, heavy sub, Atlanta trap, hypnotic, no EDM drop, no supersaw",prompt_body:"Dark, hypnotic, {mood} trap at {bpm} BPM (half-time feel) in {key}, styled after {refs}. A deep 808 bass with pitch-glide slides under a sparse, punchy kick; rattling triplet hi-hat rolls and sharp snares on the 3 drive the rhythm. A wide, dark minor synth pad and the occasional cinematic brass stab provide atmosphere. The low end is huge and controlled — sub-bass that breathes, never distorted into noise. Everything is minimal, huge, and hypnotic: energy comes from the 808 pattern, the hat rolls, and beat switches — not from a build-and-drop.\n\n{vocal}: a trap rap lead with triplet flows, auto-tuned for a melodic, metallic sheen on hooks, delivered in a hypnotic, slightly detached tone. Stacked ad-libs sit behind every accented line. Choruses are rap-led and hypnotic with repetition — not sung pop choruses.\n\nEXCLUSIONS — no EDM festival supersaw drops or DJ-Snake-style festival drop, no guitars or rock elements, no lo-fi dust, no boom-bap acoustic drums or breakbeats, no sung pop-diva chorus, no distorted-metal 808. The chorus hits via an 808 and a beat switch, never a supersaw drop.",references:["Travis Scott","Future","Drake","Don Toliver"],lyric_scaffold:"[Intro]\n(dark pad + hat roll, 4 bars, 808 teaser)\n(ad-lib: yeah... uh huh)\n\n[Chorus / Hook]\nhook line, repeated motif (ad-lib)\nhook line (ad-lib)\ntriplet flow line (ad-lib)\nhook line (ad-lib)\n\n[Verse 1]\ntriplet flow line (ad-lib)\nflow line 2 (ad-lib)\nflex line (ad-lib)\nflow line (ad-lib)\n\n[Chorus / Hook]\nhook line (ad-lib)\nhook line (ad-lib)\ntriplet flow line (ad-lib)\nhook line (ad-lib)\n\n[Verse 2]\nflow line (ad-lib)\nflow line 2 (ad-lib)\nflex line (ad-lib)\nflow line (ad-lib)\n\n[Bridge / Beat Switch]\nstripped line, 808 drops out\nad-lib\n(808 returns — beat switch)\n\n[Chorus / Hook]\nhook line (fullest, stacked ad-libs)\nhook line\ntriplet flow line\nhook line\n\n[Outro]\nhook fragment, pad fades\n(ad-lib: yeah...)",segments:[{segment:"Intro",prompt:"4-bar dark minor pad + a single hi-hat roll + 808 teaser; vocal ad-lib ('yeah...'). Establish mood and the 808 — no long build."},{segment:"Chorus / Hook",prompt:"Full beat: 808 glides, rolling triplet hats, brass stab on the 1. Hook is rap-led and hypnotic, repeated motif, stacked ad-libs — no sung pop chorus."},{segment:"Verse 1",prompt:"Keep the beat, vary the 808 pattern; triplet flow with ad-libs behind every accent. Sparse but huge."},{segment:"Chorus / Hook",prompt:"Return to the hook; full low end; hats busiest here. Rap-led, no supersaw."},{segment:"Verse 2",prompt:"Introduce a hat-pattern switch and a second pad layer; flow stays hypnotic and repetitive."},{segment:"Bridge / Beat Switch",prompt:"Drop the 808 to just pad + vocal for 2 bars; 808 and beat switch back in — energy via the switch, not a drop."},{segment:"Chorus / Hook",prompt:"Fullest texture: deepest 808, stacked ad-libs, widest hats. End on the hook motif."},{segment:"Outro",prompt:"Hook fragment over fading pad; final clean 808 hit; ad-lib out."}],drift_risks:[{risk:"EDM festival supersaw drop (DJ Snake / Marshmello style) erupts in the chorus — the single biggest trap drift.",severity:"HIGH",fix:"Explicitly exclude 'EDM drop, festival drop, supersaw lead, big-room'; describe the chorus as '808-driven, minimal, hypnotic, no supersaw'; never use the word 'drop' — use '808 hit' / 'beat switch'; keep the chorus rap-led."},{risk:"Generic sung pop chorus / sellout melodic chorus replaces the hypnotic rap hook.",severity:"HIGH",fix:"Keep the hook rap-led and hypnotic with repetition and stacked ad-libs; specify 'rap-led hook, not sung pop chorus'; limit melodic singing to auto-tuned accents only."},{risk:"Boom-bap acoustic drums (drifts to old-school hip-hop).",severity:"MEDIUM",fix:"Specify '808 + rolling trap hats, electronic, not acoustic boom-bap or breakbeat'; exclude 'boom-bap, acoustic drums, vinyl.'"},{risk:"Over-aggressive / distorted metal-style 808 overdrives the low end.",severity:"MEDIUM",fix:"Specify 'clean deep 808 with controlled sub that breathes, warm low end'; exclude 'distorted 808, metal.'"},{risk:"Lo-fi hip-hop dustiness softens the modern trap sheen.",severity:"LOW",fix:"Keep the production huge, modern, and cinematic; exclude 'lo-fi, dusty, chillhop.'"}],dos:["Make the 808 pattern and hi-hat rolls the identity of the track — they define it.","Use stacked ad-libs behind every accented line — they are core to the genre.","Advance energy via beat switches and 808 pattern changes, never via build-and-drop.","Keep the hook hypnotic and repetitive — repetition is the point.","Generate 6-8 takes; 808 tuning and the flow pocket vary widely."],donts:["Don't leave lyrics empty — provide repetitive hooks, triplet-flow cues, and (ad-lib) brackets.","Don't use the words 'drop' or 'build' — they prime EDM festival drops even when negated.","Don't add guitars, supersaws, or acoustic boom-bap drums — they break the genre instantly.","Don't over-distort the 808 — keep the sub clean, deep, and controlled so it breathes."]}
]};

const GENRE_VOCAL_DEFAULT={'nu-disco':'自定义','indie-dance':'气声男假音','melodic-deep-house':'无词人声切片','daytime-disco-poolside':'气声女声','balearic-tropical':'气声女声','indie-electropop':'气声女声','synthwave-retrowave':'自定义','downtempo-trip-hop':'自定义','lofi-chillhop':'纯器乐','ambient-cinematic':'纯器乐','orchestral-neoclassical':'纯器乐','folk-acoustic':'自定义','pop-radio':'自定义','rnb-soul':'气声灵魂女声','indie-rock':'自定义','trap-hiphop':'自定义'};
const MOOD_DEFAULTS={'nu-disco':'sunlit and funky','indie-dance':'bittersweet and nocturnal','melodic-deep-house':'introspective and expansive','daytime-disco-poolside':'breezy and golden-hour','balearic-tropical':'weightless and warm','indie-electropop':'dreamy yet driving','synthwave-retrowave':'neon-lit and melancholic','downtempo-trip-hop':'noir and cinematic','lofi-chillhop':'unhurried and contemplative','ambient-cinematic':'wide and weightless','orchestral-neoclassical':'intimate and tender','folk-acoustic':'plain and human','pop-radio':'bright and confident','rnb-soul':'warm and intimate','indie-rock':'driving and earnest','trap-hiphop':'dark and hypnotic'};
const PRESETS=[{name:'VITRINE 1 软开场',genre:'daytime-disco-poolside',bpm:100,key:'F major',vocal:'气声女声'},{name:'VITRINE 2 午间 groove',genre:'indie-dance',bpm:106,key:'A minor',vocal:'气声男假音'},{name:'VITRINE 3 镜面光泽',genre:'nu-disco',bpm:112,key:'C# minor',vocal:'气声女声'},{name:'VITRINE 4 橱窗流行',genre:'indie-electropop',bpm:116,key:'B minor',vocal:'中性假音'},{name:'VITRINE 5 滤镜绽放',genre:'nu-disco',bpm:120,key:'G minor',vocal:'无词人声切片'},{name:'VITRINE 6 天鹅绒时刻',genre:'melodic-deep-house',bpm:124,key:'F# minor',vocal:'气声灵魂女声'},{name:'VITRINE 7 海岸气流',genre:'balearic-tropical',bpm:110,key:'D major',vocal:'气声女声'},{name:'VITRINE 8 末光',genre:'daytime-disco-poolside',bpm:102,key:'E minor',vocal:'气声男假音'}];

function shortVocalFromDefault(dv){const parts=dv.split(/[,—–]/).map(s=>s.trim()).filter(s=>s.length>0);let r='';for(const p of parts){if(r.length>=30)break;r=r?r+', '+p:p}return r.length>50?r.substring(0,50).trim():r}
function getGenre(id){return KB.genres.find(g=>g.id===id)}
function buildStyleTags(g,bpm,key,vocalSel){const tags=g.style_tags;const m=tags.match(/,\s+no\s+/);let pos,neg;if(m){const i=m.index;pos=tags.substring(0,i);neg=tags.substring(i+2)}else{pos=tags;neg=''}let vt;if(vocalSel==='自定义'){vt=shortVocalFromDefault(g.default_vocal)}else if(vocalSel==='纯器乐'){vt='instrumental'}else{vt=VOCAL_MAP_STYLE[vocalSel]||'vocal'}const beatless=(g.id==='ambient-cinematic');const tempo=beatless?'beatless, no fixed tempo':bpm+' bpm';let mid=', '+tempo;if(key)mid+=', '+key;mid+=', '+vt;const negStr=neg?', '+neg:'';let r=pos+mid;const budget=200-negStr.length;if(r.length>budget){r=r.substring(0,budget);const lc=r.lastIndexOf(',');if(lc>budget-60)r=r.substring(0,lc)}return r+negStr}
function buildMainPrompt(g,bpm,key,vocalSel,mood,refs,isInst){const md=MOOD_DEFAULTS[g.id]||'atmospheric';const rd=g.references.join(', ');const beatless=(g.id==='ambient-cinematic');const bpmTok=beatless?'beatless':bpm;let vt;if(vocalSel==='自定义'){vt=g.default_vocal}else if(vocalSel==='纯器乐'){vt='instrumental, no lead vocal'}else{vt=VOCAL_MAP_PROMPT[vocalSel]?(VOCAL_MAP_PROMPT[vocalSel]+', '+g.default_vocal):g.default_vocal}let p=g.prompt_body.replace(/\{bpm\}/g,bpmTok).replace(/\{key\}/g,key||g.default_key).replace(/\{vocal\}/g,vt).replace(/\{mood\}/g,mood||md).replace(/\{refs\}/g,refs||rd);if(isInst){p=p.replace(/Vocal posture:[^.]*\./g,'').replace(/[^.\n]*\bvocal\b[^.\n]*\.(?:\s*)/gi,' ').replace(/\n{3,}/g,'\n\n');p+='\n\nThis track is entirely instrumental — no lead vocal, no vocal melody, no sung lyrics. Any vocal material must be chopped, wordless, and textural only.'}return p}
function buildSegments(g,structure){let segs=g.segments.slice();if(structure==='简单')segs=segs.slice(0,4);else if(structure==='完整')segs=segs.slice(0,Math.min(8,segs.length));return segs.map(s=>{const n=s.segment.replace(/^\[|\]$/g,'');return '\u3010'+n+'\u3011\n'+s.prompt}).join('\n\n')}
function buildRisks(g){let r=g.drift_risks.map(d=>'['+d.severity+'] '+d.risk+' \u2192 '+d.fix).join('\n\n');r+='\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\u901a\u7528\u89c4\u5219\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\u2460 \u7528 Custom Mode\n\u2461 Lyrics \u5b57\u6bb5\u522b\u7a7a\n\u2462 \u6bcf\u9996\u8dd1 4\u20138 \u6b21\uff0c\u524d 1\u20132 \u6b21\u662f\u8bca\u65ad\n\u2463 \u6bcd\u5e26\u76ee\u6807 -10 LUFS\uff0c\u6e29\u6696\n\u2464 \u8d1f\u5411\u6807\u7b7e\u653e Style \u672b\u5c3e\uff1b\u82e5\u201cno X\u201d\u53cd\u800c\u8bf1\u53d1 X\uff0c\u5220\u6389\u5b83\u628a\u6b63\u9762\u8bcd\u52a0\u500d\n\u2465 \u7ed3\u6784\u88ab\u538b\u5230 ~2:30 \u5c31\u7528 Extend \u62c9\u957f';return r}

function buildGenreTips(g){const d=(g.dos||[]).map(x=>'✓ '+x).join('\n');const n=(g.donts||[]).map(x=>'✗ '+x).join('\n');return 'DO\n'+d+'\n\nDON\u2019T\n'+n}
function generate(){const genreId=document.getElementById('genre').value;const g=getGenre(genreId);if(!g)return;const bpm=document.getElementById('bpm').value||g.default_bpm;const key=document.getElementById('key').value.trim();const vocalSel=document.getElementById('vocal').value;const mood=document.getElementById('mood').value.trim();const refs=document.getElementById('refs').value.trim();const structure=document.getElementById('structure').value;const isInst=vocalSel==='纯器乐';document.getElementById('out-style').textContent=buildStyleTags(g,bpm,key,vocalSel);document.getElementById('out-prompt').textContent=buildMainPrompt(g,bpm,key,vocalSel,mood,refs,isInst);document.getElementById('out-lyrics').textContent=isInst?(g.lyric_scaffold.replace(/\[[^\]]*\]/g,'').trim()?'[Instrumental]':g.lyric_scaffold):g.lyric_scaffold;document.getElementById('out-segments').textContent=buildSegments(g,structure);document.getElementById('out-risks').textContent=buildRisks(g);document.getElementById('out-tips').textContent=buildGenreTips(g)}

function onGenreChange(){const genreId=document.getElementById('genre').value;const g=getGenre(genreId);if(!g)return;document.getElementById('bpm').value=g.default_bpm;document.getElementById('key').value=g.default_key;document.getElementById('vocal').value=GENRE_VOCAL_DEFAULT[g.id]||'自定义';document.getElementById('refs').value=g.references.join(', ');generate()}

function applyPreset(p){const ng=getGenre(p.genre);document.getElementById('genre').value=p.genre;document.getElementById('bpm').value=p.bpm;document.getElementById('key').value=p.key;document.getElementById('vocal').value=p.vocal;document.getElementById('refs').value=ng?ng.references.join(', '):'';document.getElementById('mood').value='';generate()}

function fallbackCopy(text){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}document.body.removeChild(ta)}
function copyText(text,btn){const orig=btn.textContent;const done=()=>{btn.textContent='\u5df2\u590d\u5236 \u2713';btn.style.background='var(--accent)';btn.style.color='#fff';btn.style.borderColor='var(--accent)';setTimeout(()=>{btn.textContent=orig;btn.style.background='';btn.style.color='';btn.style.borderColor=''},1500)};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done).catch(()=>{fallbackCopy(text);done()})}else{fallbackCopy(text);done()}}

function copyAll(){const parts=['# Style \u6807\u7b7e','',document.getElementById('out-style').textContent,'','# \u4e3b\u63d0\u793a\u8bcd','',document.getElementById('out-prompt').textContent,'','# Lyrics \u5b57\u6bb5','',document.getElementById('out-lyrics').textContent,'','# \u5206\u6bb5\u63d0\u793a\u8bcd','',document.getElementById('out-segments').textContent,'','# \u98ce\u9669\u6e05\u5355 + \u901a\u7528\u89c4\u5219','',document.getElementById('out-risks').textContent,'','# 曲风 DO / DONT','',document.getElementById('out-tips').textContent];copyText(parts.join('\n'),document.getElementById('btn-copy-all'))}

function init(){const sel=document.getElementById('genre');KB.genres.forEach(g=>{const opt=document.createElement('option');opt.value=g.id;opt.textContent=g.name+' \u00b7 '+g.bpm_range;sel.appendChild(opt)});const pc=document.getElementById('presets');PRESETS.forEach(p=>{const btn=document.createElement('button');btn.className='pbtn';btn.textContent=p.name;btn.onclick=()=>applyPreset(p);pc.appendChild(btn)});document.getElementById('genre').addEventListener('change',onGenreChange);['bpm','key','vocal','mood','refs','structure'].forEach(id=>{const el=document.getElementById(id);el.addEventListener('input',generate);el.addEventListener('change',generate)});document.getElementById('btn-gen').addEventListener('click',generate);document.getElementById('btn-copy-all').addEventListener('click',copyAll);document.querySelectorAll('.cbtn').forEach(btn=>{btn.addEventListener('click',()=>{const target=btn.dataset.copy;const el=document.getElementById('out-'+target);copyText(el.textContent,btn)})});document.getElementById('genre').value=KB.genres[0].id;onGenreChange()}
window.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
