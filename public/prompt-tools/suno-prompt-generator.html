<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suno 提示词生成器</title>
<style>
:root{--bg:#f5f5f7;--surface:#fff;--text:#1d1d1f;--t2:#6e6e73;--t3:#86868b;--border:#d2d2d7;--bl:#e8e8ed;--accent:#0071e3;--accent2:#0077ed;--asoft:#e8f1fd;--r:12px;--rs:8px;--shadow:0 1px 3px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.04)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;font-size:15px}
.header{padding:48px 0 32px;text-align:center}
.header h1{font-size:32px;font-weight:700;letter-spacing:-.5px}
.header .sub{font-size:15px;color:var(--t3);margin-top:8px}
.container{max-width:1180px;margin:0 auto;padding:0 24px}
.grid{display:grid;grid-template-columns:360px 1fr;gap:28px;align-items:start;padding-bottom:48px}
.inputs{position:sticky;top:24px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--t2);margin-bottom:5px}
.field input,.field select{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--rs);font-size:14px;background:var(--surface);color:var(--text);transition:border-color .2s,box-shadow .2s;font-family:inherit}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--asoft)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.preset-label{font-size:13px;font-weight:600;color:var(--t2);margin-bottom:8px;margin-top:6px}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:18px}
.pbtn{padding:7px 6px;border:1px solid var(--border);border-radius:var(--rs);background:var(--surface);font-size:11.5px;cursor:pointer;transition:all .15s;text-align:center;line-height:1.3}
.pbtn:hover{border-color:var(--accent);background:var(--asoft);color:var(--accent)}
.pbtn:active{transform:scale(.97)}
.btn-gen{width:100%;padding:10px;border:none;border-radius:var(--rs);background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s;margin-top:4px}
.btn-gen:hover{background:var(--accent2)}
.outputs{min-width:0}
.btn-copy-all{width:100%;padding:10px;border:none;border-radius:var(--rs);background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s;margin-bottom:16px}
.btn-copy-all:hover{background:var(--accent2)}
.card{background:var(--surface);border:1px solid var(--bl);border-radius:var(--r);padding:18px 22px;margin-bottom:14px;box-shadow:var(--shadow)}
.card-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:12px}
.card-tt{font-size:15px;font-weight:650;color:var(--text)}
.cbtn{padding:3px 12px;font-size:12px;font-weight:500;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--accent);cursor:pointer;transition:all .15s;white-space:nowrap;flex-shrink:0}
.cbtn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.card-bd{font-size:13.5px;line-height:1.65;color:#424245;white-space:pre-wrap;word-break:break-word}
.footer{padding:24px 0 48px;text-align:center;font-size:13px;color:var(--t3)}
@media(max-width:900px){.grid{grid-template-columns:1fr}.inputs{position:static}}
</style>
</head>
<body>
<header class="header"><div class="container"><h1>Suno 提示词生成器</h1><p class="sub">16 曲风 · 内置防漂移方法论 · 离线即用</p></div></header>
<main class="container"><div class="grid">
<aside class="inputs">
<div class="field"><label for="genre">曲风</label><select id="genre"></select></div>
<div class="preset-label">预设</div>
<div class="presets" id="presets"></div>
<div class="field-row">
<div class="field"><label for="bpm">BPM</label><input type="number" id="bpm" min="50" max="200"></div>
<div class="field"><label for="key">调 / Key</label><input type="text" id="key" placeholder="C minor"></div>
</div>
<div class="field"><label for="vocal">人声</label><select id="vocal">
<option value="气声女声">气声女声</option>
<option value="气声男假音">气声男假音</option>
<option value="中性假音">中性假音</option>
<option value="无词人声切片">无词人声切片</option>
<option value="气声灵魂女声">气声灵魂女声</option>
<option value="男声胸声">男声胸声</option>
<option value="女声belt">女声 belt</option>
<option value="纯器乐">纯器乐</option>
<option value="自定义">默认（用曲风自带人声）</option>
</select></div>
<div class="field"><label for="mood">情绪 / Mood（可选）</label><input type="text" id="mood" placeholder="留空则用曲风默认"></div>
<div class="field"><label for="refs">参考艺人（可选）</label><input type="text" id="refs" placeholder="留空则用曲风默认"></div>
<div class="field"><label for="structure">结构</label><select id="structure">
<option value="简单">简单（4 段）</option>
<option value="完整" selected>完整（6–7 段）</option>
<option value="扩展">扩展（全部）</option>
</select></div>
<button class="btn-gen" id="btn-gen">生成</button>
</aside>
<section class="outputs">
<button class="btn-copy-all" id="btn-copy-all">全部复制</button>
<div class="card"><div class="card-hd"><span class="card-tt">Style 标签</span><button class="cbtn" data-copy="style">复制</button></div><div class="card-bd" id="out-style"></div></div>
<div class="card"><div class="card-hd"><span class="card-tt">主提示词</span><button class="cbtn" data-copy="prompt">复制</button></div><div class="card-bd" id="out-prompt"></div></div>
<div class="card"><div class="card-hd"><span class="card-tt">Lyrics 字段</span><button class="cbtn" data-copy="lyrics">复制</button></div><div class="card-bd" id="out-lyrics"></div></div>
<div class="card"><div class="card-hd"><span class="card-tt">分段提示词</span><button class="cbtn" data-copy="segments">复制</button></div><div class="card-bd" id="out-segments"></div></div>
<div class="card"><div class="card-hd"><span class="card-tt">风险清单 + 通用规则</span><button class="cbtn" data-copy="risks">复制</button></div><div class="card-bd" id="out-risks"></div></div>
<div class="card"><div class="card-hd"><span class="card-tt">曲风 DO / DON’T</span><button class="cbtn" data-copy="tips">复制</button></div><div class="card-bd" id="out-tips"></div></div>
</section>
</div></main>
<footer class="footer"><div class="container"><p>负向标签放末尾 / 正面词在前 / 别留空 Lyrics — 这三条是 Suno 出好结果的关键。</p></div></footer>
<script>
const KB={genres:[
{id:"nu-disco",name:"Nu-Disco / French Touch",bpm_range:"108-118",default_bpm:112,default_key:"C minor",default_vocal:"filtered falsetto hooks, talkbox textures, sparse chopped vocal stabs",style_tags:"nu-disco, French Touch, chop-filtered disco samples, funky bass, four-on-the-floor drum machine, warm analog pads, talkbox, sidechain pump, swing pocket, no EDM drop, no trap hats",prompt_body:"Compressed, pump-breathing nu-disco in the French Touch tradition at {bpm} BPM in {key}. The groove is a chop-filtered disco sample looped bar-by-bar with heavy sidechain compression ducking under a tight, syncopated funky bassline and a four-on-the-floor drum machine with a swung 16th-pocket hi-hat. Layer warm analog Juno/Prophet pads, glitterball guitar chops, and Rhodes stabs; the signature motion comes from filter sweeps opening and closing on the sample and from layer addition — not from risers or drops. Vocal posture: {vocal}, processed through a talkbox/vocoder so the hook feels robotic and hypnotic rather than performed. Mood: {mood}, sunlit but with that slightly haunted French Touch weight. Reference palette: {refs}.\n\nKeep the energy in a sustained, rolling pocket across the whole track — it should feel like one long, glittering filter movement, never a tension-and-release EDM arc. The bass stays forward and funky the entire time; even in breaks it keeps walking.\n\nEXCLUSIONS: No EDM build-and-drop, no snare-roll buildups, no white-noise festival risers, no trap hats or 808s, no generic billboard pop belting. Transitions happen by closing a filter, dropping to bass+drums, then reopening — never by a snare roll into a drop.",references:["Daft Punk","Breakbot","Stardust","Parcels"],lyric_scaffold:"[Intro][Instrumental — filtered groove establishes, single talkbox stab]\n[Verse 1]\n(move) keep it on the line\n(move) body on the line\n(talkbox) shine, shine, shine\n[Chorus]\nall night, all night, all night\nkeep the fire, keep the fire\n(all night) all night\n[Instrumental — filter close-and-reopen, bass forward, no drop]\n[Verse 2]\n(move) stay on the line\n(talkbox) shine, shine\n[Chorus]\nall night, all night, all night\nkeep the fire, keep the fire\n[Outro][Instrumental — slow filter close, vinyl fade, no big finish]",segments:[{segment:"[Intro]",prompt:"A single filtered disco chop looped over a sidechain-pumping kick, vinyl crackle, one talkbox stab per bar. Filter starts half-closed and slowly opens — no riser, no snare roll, the groove is already moving."},{segment:"[Verse 1]",prompt:"Funky syncopated bass enters full and forward, talkbox vocal hook lands on the one, glassy Rhodes stabs fill the gaps. Four-on-the-floor maintained, swing pocket intact."},{segment:"[Pre-Chorus]",prompt:"The sample filter opens toward full brightness, pads swell warmer, a second guitar chop layers in. Groove stays flat — no lift via riser, only via filter openness and density."},{segment:"[Chorus]",prompt:"Full French Touch compression clamp: every element pumping together, chopped vocal hook repeated, glitterball guitar fills. Maximum warmth, still no drop — it's a sustained peak plateau, not a hit."},{segment:"[Instrumental Break]",prompt:"Strip to bass + drums + talkbox, then run the filter closed and slowly reopen over 8 bars. Bass walks the whole time. This is the motion mechanism — filter sweep, not a drop."},{segment:"[Verse 2]",prompt:"Drop back to bass and swung kick, talkbox returns sparse, one pad chord per bar. Pocket stays slinky and forward."},{segment:"[Chorus]",prompt:"Return to full compression with an extra layered vocal chop and brighter guitar. Filter fully open, warmest point of the track, still a plateau groove."},{segment:"[Outro]",prompt:"Slowly close the filter over 8-12 bars, bass and vinyl crackle last, fade on the talkbox stab. No big hit ending — it dissolves."}],drift_risks:[{risk:"Suno defaults to a build-and-drop EDM structure (snare-roll riser into a peak then breakdown), which kills the continuous French Touch groove.",severity:"HIGH",fix:"Frame the style and prompt around 'sustained groove pocket, energy advances by filter sweeps and layer addition, continuous four-on-the-floor, no build-and-drop structure'. Avoid the words drop/build/peak in the prompt — they prime Suno even when negated; use 'warm bloom' and 'filter sweep' instead."},{risk:"Trap-influenced hi-hat rolls and 808 sub-bass bleed in under the disco samples.",severity:"HIGH",fix:"Specify 'four-on-the-floor drum machine only, 16th swing hi-hats, no trap hats, no 808s, no snare rolls' in style tags and reinforce in the prompt body."},{risk:"White-noise riser buildups sneak into pre-chorus transitions.",severity:"MEDIUM",fix:"Insist on 'transitions via filter close-and-reopen and drop-outs to bass+drums, never via snare rolls or white-noise sweeps'."},{risk:"Over-compression mud — Suno piles on loudness until the low end turns to mush and loses the funky pocket.",severity:"MEDIUM",fix:"Reference 'tight, punchy French Touch sidechain pump, bass locked to kick, analog warmth not digital clipping' and keep bpm under 115 so it stays slinky."},{risk:"Vocal drifts toward generic billboard pop belting on the chorus.",severity:"LOW",fix:"Pin the vocal posture to 'processed falsetto/talkbox/vocoder chops' and forbid 'belted', 'powerful', 'diva' anywhere."}],dos:["Use Custom Mode and always populate the lyrics field — empty lyrics trigger Suno's auto narrative-pop","Generate 4-8 takes; treat the first 1-2 as diagnostic for which drift you're fighting","Drive energy by filter sweeps, layer addition, and compression pump — never build-and-drop","Keep the bass syncopated and forward; it's the genre's spine","If a negative tag backfires, delete it and double the opposite positive (e.g. remove 'no trap', add 'four-on-the-floor drum machine only')"],donts:["Don't use the words drop/build/peak/anthemic — they prime EDM even negated; use warm bloom / filter sweep","Don't rely on white-noise risers or snare rolls for transitions — use filter close-and-reopen","Don't add trap hats, 808s, or big-room supersaw leads","Don't write narrative pop lyrics — keep the scaffold image-based and repetitive so the groove carries","Don't over-stuff the style string past ~200 chars — Suno truncates and drops the negative tail"]},
{id:"indie-dance",name:"Indie Dance / Synth-Pop",bpm_range:"104-120",default_bpm:115,default_key:"A minor",default_vocal:"reverb-drenched, slightly detached indie vocal, breathy verse, soaring-but-restrained chorus hook",style_tags:"indie dance, synth-pop, shimmering analog arpeggios, four-on-the-floor, glassy Juno pads, melancholic italo bassline, no acoustic, no EDM drop, no trap, no lofi dust",prompt_body:"Melancholic-but-danceable indie synth-pop at {bpm} BPM in {key}, built on shimmering analog Juno/Prophet arpeggios, glassy chorus-drenched chord pads, an italo-disco style pulsing bassline, and a driving four-on-the-floor kick with a touch of swing. Layer clean electric guitar shimmer and soft hand percussion. Motion comes from arpeggio interplay, pad swells, and texture layering — not from risers or drops. Vocal posture: {vocal}, soaked in reverb, sitting slightly behind the beat, breathy and stylized in the verse and lifting — never belting — into the chorus. Mood: {mood}, bittersweet and nocturnal, neon-lit. Reference palette: {refs}.\n\nThe track should feel like one long, glowing textural lift: elements keep layering and brightening across verses and choruses so the energy rises through density and warmth, not through a build-and-drop arc.\n\nEXCLUSIONS: No confessional singer-songwriter intimacy, no acoustic guitar, no whispered-close vocal, no lo-fi dusty vinyl, no EDM build-and-drop, no snare-roll risers, no trap hats, no billboard pop belting. The vocal must stay stylized and reverb-drenched the entire time.",references:["Robyn","Cut Copy","LCD Soundsystem","Classixx"],lyric_scaffold:"[Intro][Instrumental — Juno arpeggio + four-on-the-floor, glassy pads rising]\n[Verse 1]\nneon on the wet street\nyou were already gone\nlights in the rain\n(lights in the rain)\n[Pre-Chorus]\ncarry it, carry it home\ncarry it through the static\n[Chorus]\nwe run, we run, we run\nthrough the neon, through the neon\nwe run\n[Instrumental — synth arpeggio interplay, melancholic, no drop]\n[Bridge]\n(static) hold the signal\nhold the signal\n[Chorus]\nwe run, we run, we run\nthrough the neon\n[Outro][Instrumental — arpeggio decay into reverb tail]",segments:[{segment:"[Intro]",prompt:"Juno arpeggio cycling, four-on-the-floor kick enters at bar 5, glassy pad swells in from below. No riser — the arpeggio itself is the motion."},{segment:"[Verse 1]",prompt:"Breathy reverb-soaked vocal enters slightly behind the beat, italo bassline pulses, guitar shimmer on the off-beats. Kick stays steady."},{segment:"[Pre-Chorus]",prompt:"A second pad layer opens, arpeggio brightens, vocal floats higher in register but stays breathy — no snare roll, no riser, only warmth and density."},{segment:"[Chorus]",prompt:"Neon synths bloom full, vocal lifts through tone (not volume), full four-on-the-floor drive. This is a textural peak, not a drop."},{segment:"[Instrumental]",prompt:"Strip back to two interlocking arpeggios and the bassline, melancholic and hypnotic. Texture carries it — no drop, no buildup."},{segment:"[Bridge]",prompt:"Vocal and a single Juno chord pad, dreamy, heavy reverb tail, kick drops out. Behind-the-beat phrasing."},{segment:"[Chorus]",prompt:"Full warmth returns, layered doubled vocals, arpeggios at brightest, driving groove to the end."},{segment:"[Outro]",prompt:"Arpeggio slows and decays into a long reverb tail, kick fades, one pad chord sustains. Dissolve, no big finish."}],drift_risks:[{risk:"Suno collapses the production to a lone acoustic guitar or piano under an intimate whispered vocal — the single most common drift for this genre.",severity:"HIGH",fix:"Pin production to 'synth-forward, no acoustic guitar, vocal drenched in hall reverb and slightly detached, stylized not intimate' and explicitly forbid 'acoustic', 'confessional', 'singer-songwriter', 'whispered-close' in both style and prompt."},{risk:"EDM build-and-drop creeps in under the four-on-the-floor, turning an indie track into festival house.",severity:"HIGH",fix:"Write 'energy advances by layer addition, pad swells, and arpeggio interplay — no build-and-drop, no riser into a drop section'. Replace 'drop' language with 'warm bloom' and 'lift through texture'."},{risk:"Lo-fi hip-hop dustiness — vinyl crackle and muffled, detuned drums appear because Suno reads 'indie' as 'lofi'.",severity:"MEDIUM",fix:"Specify 'clean modern production, crisp drums, no vinyl crackle, no dusty muffled kit'. Keep the drum tone open and present."},{risk:"Chorus drifts into generic Max-Martin-style billboard pop belting.",severity:"MEDIUM",fix:"Hold the vocal to 'breathy, detached, reverb-drenched, soaring through tone not volume' and never use 'belted', 'powerful', 'diva'."},{risk:"80s pastiche tips into cheesy nostalgia rather than bittersweet.",severity:"LOW",fix:"Anchor to melancholic minor-key melody and analog (not digital) synth tones; reference the {refs} palette explicitly to keep tone restrained."}],dos:["Always fill the lyrics scaffold — empty lyrics auto-generate confessional singer-songwriter text","Generate 4-8 takes; the first take usually reveals whether vocal drift or drop drift is winning","Keep the vocal drenched in reverb and slightly behind-the-beat — that's what stops confessional intimacy","Build choruses by adding synth layers and opening pads, not by snare-roll risers","If structure compresses to ~2:30, use Suno Extend on the instrumental bridge rather than speeding up"],donts:["Don't let the vocal go confessional/intimate — keep it stylized, drenched in reverb, slightly detached","Don't introduce acoustic guitar or stripped-live arrangements — that's the #1 drift path","Don't use build-and-drop structure — layer addition and pad swells carry the energy","Don't add trap hats, dusty lo-fi drums, or EDM risers","Don't belt the chorus diva-style — soar through tone, not volume"]},
{id:"melodic-deep-house",name:"Melodic Deep House",bpm_range:"118-124",default_bpm:122,default_key:"F# minor",default_vocal:"ethereal breathy floating vocal, whispered hooks, occasional wordless pad-like vocal layers",style_tags:"melodic deep house, rolling sub bass, warm evolving pads, dub techno chords, plucked motifs, deep four-on-the-floor, hypnotic groove, no EDM drop, no supersaw, no festival riser",prompt_body:"Hypnotic, deep, emotionally weighty melodic house at {bpm} BPM in {key}, built on a rolling sub-bass line, a deep four-on-the-floor kick, warm evolving analog pads (Jupiter/Juno/Modular), plucked synth motifs, and dub-techno-influenced chord stabs bathed in long reverb tails. The genre's signature is slow evolution over long 32-64 bar arcs: energy advances through filter movement, pad textural change, and cumulative layering — never through a build-and-drop or a riser into a peak. Vocal posture: {vocal}, sitting high and airy above the mix, functioning almost like another pad. Mood: {mood}, introspective and expansive, cinematic but always dancing. Reference palette: {refs}.\n\nThe whole track should feel like a single slow breath: filters open, layers accumulate, the texture blooms into a warm peak plateau, then recedes — a sustained arc rather than a tension-release hit.\n\nEXCLUSIONS: No EDM build-and-drop, no big-room supersaw leads, no white-noise festival risers, no snare-roll buildups, no trap hats, no belted vocal-house diva vocals, no frantic 128+ BPM festival tempo. Keep it deep, hypnotic, and warm throughout.",references:["Lane 8","Ben Bohmer","Yotto","CamelPhat"],lyric_scaffold:"[Intro][Instrumental — deep kick, rolling sub bass, dub chord stab, long filter-in over 16 bars]\n[Verse 1]\nunder the surface\n(under)\nbreathe it in\nbreathe\n[Build — texture accumulates via filter movement, no riser, no drop]\n(carry it) carry\n(carry it) under\n[Peak / Textural Bloom]\n(wordless vocal pad layer, full warmth, motif opens)\n[Breakdown]\n(strip to sub bass + reverb vocal, space)\nbreathe\n[Second Peak]\n(carry it) under the surface\n[Outro][Instrumental — slow filter close, sub bass fade, no big ending]",segments:[{segment:"[Intro]",prompt:"Deep kick from bar 1, rolling sub bass enters at bar 5, a dub chord stab on the off-beat, a single plucked motif fading in through a slowly opening filter over 16 bars. No riser — the filter-in is the motion."},{segment:"[Verse 1]",prompt:"Plucked motif fully present, warm pad swells underneath, ethereal whispered vocal enters high and airy. Kick and sub bass steady, groove locked."},{segment:"[Build]",prompt:"Over 32 bars the filter opens on the pads, a second motif layers in, percussion thickens (shaker, not trap hats). This is cumulative texture — no snare roll, no riser, no drop at the end."},{segment:"[Peak / Textural Bloom]",prompt:"Pads fully open, wordless vocal pad layer floats on top, motif brightens. Maximum warmth — a sustained plateau, not a hit. No supersaw lead, no white noise."},{segment:"[Breakdown]",prompt:"Strip to sub bass, kick, and the reverb-soaked vocal with long tails. Space and air. Sub bass keeps rolling — forward motion never stops."},{segment:"[Second Peak]",prompt:"Motif returns in variation, layered percussion builds the groove again, pads reopen. Warmth returns through texture, not a riser."},{segment:"[Outro]",prompt:"Filters slowly close over 16 bars, motifs drop away one by one, sub bass and kick last, then fade. No big finish — it recedes."}],drift_risks:[{risk:"Suno converts the hypnotic arc into a big-room EDM drop with a supersaw lead and white-noise riser — the dominant failure mode for this genre.",severity:"HIGH",fix:"Specify 'long-arc development over 32+ bars via filter movement, pad textural change, and layer accumulation — no drop, no riser, no white-noise sweep'. Frame the peak as a 'warm textural bloom', not a drop."},{risk:"Aggressive main-stage supersaw lead synth takes over the melody.",severity:"HIGH",fix:"Insist on 'warm analog pads (Jupiter/Juno), plucked motifs, no saw-stack supersaw lead, no main-stage synth'. Reference {refs} explicitly to anchor the tone."},{risk:"Vocal-house diva belting appears instead of the ethereal whispered tone.",severity:"MEDIUM",fix:"Pin the vocal to 'ethereal, breathy, whispered, floating, wordless pad layers' and forbid 'diva', 'belted', 'powerful'."},{risk:"Tempo creeps to 126-130 and tips into festival/progressive house.",severity:"MEDIUM",fix:"Lock bpm to 120-124 and describe the groove as 'hypnotic and rolling, not frantic'. Avoid the word 'festival'."},{risk:"The track flatlines into ambient/chillout with no forward motion.",severity:"LOW",fix:"Maintain 'rolling sub bass and four-on-the-floor deep kick throughout, forward hypnotic motion' — keep the bass walking even in breakdowns."}],dos:["Always fill the lyrics scaffold with sparse, repetitive, image-based lines — empty lyrics generate unwanted narrative pop","Generate 6-8 takes; melodic deep house needs more sampling to find the hypnotic pocket","Develop the track over long 32-64 bar arcs via filter movement and texture, not verse-chorus pop structure","Keep the bassline rolling and the kick deep and consistent — it's the hypnotic spine","Master warm around -10 LUFS; if it compresses to ~2:30, Suno Extend the peak rather than cutting the arc short"],donts:["Don't structure as build-and-drop — use long-arc filter and texture evolution over 32+ bars","Don't use supersaw main-stage leads, big-room white-noise risers, or festival clap builds","Don't let the tempo creep past 124 toward 128 festival house — keep it hypnotic, not frantic","Don't add belted vocal-house diva vocals — keep it ethereal and whispered","Don't let it flatline into ambient chillout — maintain the rolling bass groove and forward motion"]},
{id:"daytime-disco-poolside",name:"Daytime Disco / Poolside (Chill Lounge)",bpm_range:"102-114",default_bpm:108,default_key:"C major",default_vocal:"soft airy cooed vocal, lush stacked harmonies, laid-back behind-the-beat phrasing",style_tags:"daytime disco, poolside, warm Rhodes, laid-back disco groove, glassy guitar, soft four-on-the-floor, sun-drenched pads, brushed percussion, no lofi dust, no trap hats, no EDM drop",prompt_body:"Sun-drenched, laid-back daytime disco at {bpm} BPM in {key}, floating just behind the beat. The groove is a gentle four-on-the-floor with a soft, round kick, brushed live percussion, warm Rhodes and glassy electric piano chords, clean electric guitar chops, and lush analog pad washes — a true disco pocket played soft and slow, never a half-time lofi loll. Layer soft bongo/conga percussion and a muted walking bass. Motion comes from gentle filter sweeps, pad blooms, and harmony layering — no risers, no drops. Vocal posture: {vocal}, stacked into rich three-part harmonies, delivered as if sung into a warm room. Mood: {mood}, breezy, golden-hour, contented. Reference palette: {refs}.\n\nThe track should unfold as one long, warm afternoon: elements drift in and out, harmonies swell and recede, but the soft disco pulse keeps it gently dancing the whole time — never sleepy, never saccharine.\n\nEXCLUSIONS: No lo-fi hip-hop dustiness (no vinyl crackle, no muffled detuned drums, no tape hiss), no trap hats or 808s, no build-and-drop EDM structure, no white-noise risers, no tropical-house flute or panpipe leads, no royalty-free elevator muzak anonymity. Production stays clean, warm, and human.",references:["Poolside","Roosevelt","Yumi Zouma","Aeroplane"],lyric_scaffold:"[Intro][Instrumental — warm Rhodes, gentle kick, glassy guitar chord, sun-drenched]\n[Verse 1]\nsun on the water\n(slow it down)\nwe float, we float\n[Pre-Chorus]\ncarry the afternoon\ncarry it\n[Chorus]\ngolden, golden, golden\nstay a while, stay\n(golden)\n[Instrumental — Rhodes and guitar interplay, soft percussion, no drop]\n[Bridge]\n(hold) by the water\n(hold) stay\n[Chorus]\ngolden, golden, golden\nstay a while\n[Outro][Instrumental — gentle Rhodes sustain, harmonies fade, no big ending]",segments:[{segment:"[Intro]",prompt:"Warm Rhodes chord cycle, soft kick enters at bar 5, glassy guitar chord on the off-beat, one pad wash. Sun-drenched, already grooving — no build."},{segment:"[Verse 1]",prompt:"Soft airy vocal enters just behind the beat, muted walking bass and brushed congas support, first harmony layer arrives. Disco pocket maintained, soft and forward."},{segment:"[Pre-Chorus]",prompt:"A pad wash swells in, gentle filter sweep opens the guitar, second harmony stacks under the lead. Steady groove — no riser, only warmth and density."},{segment:"[Chorus]",prompt:"Full warm groove, lush three-part harmonies, sun-drenched pads at their brightest. A textural peak, not a drop — the pocket never changes intensity."},{segment:"[Instrumental]",prompt:"Rhodes and clean guitar trade melodic lines, soft percussion fills, bass walks. No drop, no buildup — interplay and texture."},{segment:"[Bridge]",prompt:"Strip to vocal + Rhodes + pad, dreamy and behind-the-beat, reverb tail long. Kick drops out briefly, pocket returns gently."},{segment:"[Chorus]",prompt:"Full warmth returns, harmonies at their richest, pads and guitar brightest. Sustained golden plateau to the end."},{segment:"[Outro]",prompt:"Gentle filter close, Rhodes sustains, harmonies dissolve into a reverb tail, soft kick fades last. No big ending — it drifts away."}],drift_risks:[{risk:"Suno reads 'chill' as lo-fi hip-hop and adds dusty vinyl crackle, muffled detuned drums, and a lazy half-time feel — the #1 drift for this genre.",severity:"HIGH",fix:"Explicitly specify 'clean warm production, no vinyl crackle, no dusty muffled drums, no tape hiss, soft live-feel brushed percussion' and forbid 'lo-fi', 'dusty', 'crackle', 'muffled' in style and prompt. Anchor bpm at 106-110 so it keeps a gentle disco pulse, not a lofi loll."},{risk:"EDM build-and-drop structure appears under the laid-back groove.",severity:"HIGH",fix:"Frame energy as 'steady groove with gentle filter sweeps and texture bloom, no build-and-drop, no riser'. Use 'warm bloom' instead of 'drop'."},{risk:"The track flattens into royalty-free elevator/lounge muzak with no hooks.",severity:"MEDIUM",fix:"Insist on 'memodic melodic hooks, human pocket, warm musical progression' and forbid 'background', 'elevator', 'stock'. Reference {refs} to keep a real-song character."},{risk:"Tempo sags into drowsy downtempo/chillout, losing the disco pulse.",severity:"MEDIUM",fix:"Keep bpm at 106-112 and describe 'forward gentle groove, disco pocket, behind-the-beat but not sleepy'."},{risk:"Tropical-house cliches — flute, steel-pan, or panpipe leads — creep in.",severity:"LOW",fix:"Specify 'warm Rhodes, glassy guitar, soft pads' and forbid 'flute', 'panpipe', 'tropical lead'."}],dos:["Always fill the lyrics scaffold — empty lyrics drift toward generic muzak or unwanted confessional pop","Generate 4-8 takes; this genre is subtle and the first takes usually over-do either dust or tempo","Keep the groove slightly behind the beat — that laid-back pocket is what separates daytime disco from lofi","Build sections by gentle filter sweeps and layer addition, never by risers or drops","Keep the drums clean and live-feel (brushed percussion, soft kick) — no dusty vinyl character"],donts:["Don't add vinyl crackle, dusty muffled drums, or lo-fi tape saturation — that's the dominant drift here","Don't use trap hats, 808s, or any build-and-drop EDM structure","Don't use tropical-house flute or panpipe leads — they instantly cheapen the vibe","Don't let the tempo sag below ~104 into downtempo/sleepy territory — keep the disco pocket","Don't use anonymous stock chord progressions that read as royalty-free muzak"]},
{id:"balearic-tropical",name:"Balearic / Tropical House",bpm_range:"100-115",default_bpm:108,default_key:"A minor",default_vocal:"breathy, airy, close-mic'd female vocal — whispered hooks and wordless sunset melodies, never belted",style_tags:"nylon guitar, marimba, steel-pan plucks, warm pads, deep-house four-on-floor, bouncy offbeat bass, congas, Balearic sunset, no trap hats, no snare builds, no EDM drop, no dembow",prompt_body:"Warm Balearic / tropical house at {bpm} BPM, key {key}. Sun-drenched groove built on a deep-house four-on-the-floor kick with a soft, rounded attack, paired with an offbeat open-hat and a bouncy, syncopated offbeat bass line. Lead textures come from nylon-string acoustic guitar, marimba; steel-pan plucks stay in the background as a countermelody; a filtered breathy synth-lead motif carries the hook — all drenched in hall reverb with oceanic tails. Lush analog pads bloom underneath with a slow filter sweep that opens across each section. References in the spirit of {refs}.\n\n{vocal} sits high in the mix, breathy and close-mic'd, never belted — whispered hooks and airy wordless melodies, as if sung at golden hour on a shoreline. Mood is {mood}: weightless, warm, glowing, but never sleepy or saccharine.\n\nDO NOT generate EDM festival build-and-drop sections, snare-roll buildups, trap hi-hats or 808 subs, reggaeton/dembow patterns, or cruise-ship calypso pan-pipe muzak. Energy advances ONLY by filter sweeps, textural layering, and groove — never by snare-roll-and-drop.",references:["Kygo","Robin Schulz","Klangkarussell","Bakermat"],lyric_scaffold:"[Intro]\n(instrumental — marimba motif over ocean pad, filtered noise swell)\n\n[Verse]\nsun on the water\nwe fade to gold\nslow, slow, slow\n\n[Pre-Chorus]\n(filter lifts — wordless \"ahh, ahh\")\n\n[Chorus]\nhold the light\nhold the light\nsalt and the slow sun\nhold the light\n\n[Instrumental Break]\n(nylon guitar + steel pans, congas enter)\n\n[Chorus]\nhold the light\nsalt and the slow sun\n\n[Outro]\n(instrumental — pad and ocean noise, marimba fragments, slow fade)",segments:[{segment:"Intro",prompt:"Marimba motif and nylon-guitar countermelody over an oceanic pad and a filtered noise swell; a soft kick on every quarter establishes tempo. No hats yet. Filter half-closed."},{segment:"Verse",prompt:"Add the deep-house four-on-floor kick, offbeat open-hat, and bouncy offbeat bass. Breath vocal enters, sparse and close-mic'd. Pads stay filtered; congas and shaker add detail."},{segment:"Pre-Chorus",prompt:"Filter opens halfway; the filtered synth-lead motif enters; congas and shaker intensify. Vocal lifts in register but stays breathy. No snare roll — a filter sweep carries the rise."},{segment:"Chorus",prompt:"Full bloom: pads open wide, steel-pan plucks add a background countermelody, bass widens. Vocal hook lands. A warm filter sweep provides the lift — explicitly no build-and-drop."},{segment:"Breakdown",prompt:"Strip to pad, nylon guitar, and rimshot. Vocal echoes with delay throws; steel pans answer in the gaps. Texture thins; the groove keeps breathing."},{segment:"Chorus 2",prompt:"Return with an extra nylon-guitar layer and shaker 16ths; a second pan-flute line weaves above. Groove carries the energy, not a drop."},{segment:"Outro",prompt:"Filter slowly closes; pad and ocean noise remain; the marimba motif fragments and fades to silence over a fading kick."}],drift_risks:[{risk:"EDM festival build-and-drop: Suno defaults to a snare-roll buildup into a big-room synth drop, instantly killing the sunset-house vibe.",severity:"HIGH",fix:"Add 'no snare rolls, no EDM drop' as the LAST style tags (Suno weights them least there but they still help); in EVERY segment prompt write 'filter sweep lift only, no snare roll'; delete the word 'drop' everywhere and replace with 'warm bloom'."},{risk:"Trap hi-hats and 808 sub-bass creep in under the groove.",severity:"HIGH",fix:"Specify 'deep-house four-on-floor kick, offbeat open-hat, offbeat round bass, no trap hats, no 808' in style tags; name acoustic percussion (congas, shaker, rimshot) as the groove carriers."},{risk:"Reggaeton/dembow or moombahton syncopation replaces the house groove.",severity:"MEDIUM",fix:"Anchor explicitly to 'deep-house four-on-floor, offbeat bass, straight not syncopated'; avoid the phrase 'tropical rhythm' which can prime dembow — use 'Balearic house groove' instead."},{risk:"Cheesy cruise-ship calypso / royalty-free pan-pipe muzak.",severity:"MEDIUM",fix:"Specify 'tasteful, deep, Balearic, sunset' and reference concrete analog pads + a real nylon-guitar lead; cite {refs} (Kygo, Klangkarussell) by name; avoid tagging 'steel drums' alone — pair it with 'marimba, subtle'."},{risk:"Vocal drifts to belting pop or confessional singer-songwriter intimacy.",severity:"LOW",fix:"State 'breathy, whispered, close-mic'd, never belted' in prompt_body and repeat the cue in chorus segments; keep lyric lines short, repetitive, and image-based."}],dos:["Generate 6-8 takes; the first 1-2 are diagnostic — listen specifically for trap hats, a snare roll before the chorus, or a sudden festival drop.","Master warm around -10 LUFS; the four-on-floor kick should feel soft and rounded, not punchy or club-aggressive.","Advance energy ONLY with filter sweeps and textural layering (add guitar, add steel pans, open the pad) — never build-and-drop.","Keep the lyric field sparse and image-based (sun, water, salt, gold); short phrases with repetition and long instrumental space.","Use Custom Mode; if a take drifts to EDM, delete the trigger word that caused it ('drop'/'build') and re-roll rather than over-negating — if a negative backfires, delete it and double the positive."],donts:["Don't use the words 'drop', 'build', 'peak', 'anthemic' — they prime Suno toward festival EDM even when negated; use 'warm bloom' and 'filter sweep lift' instead.","Don't leave the lyric field empty — Suno auto-writes narrative pop lyrics that destroy the sunset vibe.","Don't use trap hi-hat rolls, 808 sub-bass, or reggaeton dembow patterns — they break the Balearic house groove.","Don't use belting pop vocals or 'steel drums' as a lone tag (primes calypso muzak).","Don't write the words 'tropical rhythm' — it primes dembow/moombahton."]},
{id:"indie-electropop",name:"Indie Electropop / Nu-Pop",bpm_range:"110-128",default_bpm:118,default_key:"D major",default_vocal:"reverb-drenched indie vocal — airy, present, slightly idiosyncratic, layered harmonies on hooks, never polished-pop belting",style_tags:"glassy synth arpeggios, Prophet-5 pads, FM bells, LinnDrum, gated snare, plucky synth bass, jangly chorus guitar, dreamy melancholic shimmer, no trap hats, no EDM drop, no acoustic",prompt_body:"Indie electropop / nu-pop at {bpm} BPM, key {key}. Production centers on glassy analog arpeggios (Prophet-5 / Juno-106 voicing) cycling through minor-key progressions, underpinned by warm chord pads and a plucky synth bass. Drums are a tight LinnDrum-style machine — crisp kick, gated-reverb snare on 2 and 4, steady 8th-note hats — propulsive but never trap. A jangly, chorus-drenched electric guitar accents the backbeat. References in the spirit of {refs}.\n\n{vocal} carries the melody: airy, present, reverberant with long tails, indie-tinged and slightly idiosyncratic rather than polished pop — layered harmonies stack on the hooks. Mood is {mood}: dreamy yet driving, melancholic but buoyant, ache and energy held in balance.\n\nDO NOT generate EDM build-and-drop, trap hi-hat rolls or 808 subs, acoustic singer-songwriter intimacy, or anonymous Max-Martin billboard belting. Transitions move by filter sweep and textural layering, never snare-roll-and-drop; the vocal stays indie and airy throughout.",references:["CHVRCHES","Sylvan Esso","Phantogram","M83"],lyric_scaffold:"[Intro]\n(glassy synth arp cycles — instrumental, pad swell)\n\n[Verse]\nneon on the kitchen floor\nyou said forever like a question\nthe radio half-awake\n\n[Pre-Chorus]\n(arp lifts an octave, pad thickens)\n\n[Chorus]\nwe are the static\nwe are the static\nrunning on a wire\nrunning on a wire\n\n[Verse 2]\nstatic on the stairwell\nyour coat still on the chair\n\n[Bridge]\n(strip to pad + vocal, tape-delay throws)\n\n[Chorus]\nwe are the static\nrunning on a wire\n\n[Outro]\n(arp fragments, reverb tail, slow fade)",segments:[{segment:"Intro",prompt:"Glassy synth arpeggio cycles alone with a soft pad swell; kick-less for 4 bars to establish the dream. Tape warmth on top end."},{segment:"Verse",prompt:"Add the LinnDrum groove (punchy kick, gated snare on 2 and 4, steady 8th hats) and plucky synth bass. Vocal enters, airy and close. Arp continues underneath."},{segment:"Pre-Chorus",prompt:"Arp lifts an octave; pad thickens; a filter opens halfway. Vocal harmonies stack. No snare roll — a filter sweep carries the rise."},{segment:"Chorus",prompt:"Full bloom: pads open wide, jangly chorus guitar on the backbeat, bass widens, vocal melody soars but stays indie-airy. A filter sweep provides the lift."},{segment:"Verse 2",prompt:"Drop back to drums + arp + bass; guitar drops out. Vocal variation, more intimate, almost spoken in places. Arp keeps cycling."},{segment:"Bridge",prompt:"Strip to pad and vocal with tape-delay throws; drums reduced to a rimshot on 3. Textural breakdown — no build, no drop."},{segment:"Chorus",prompt:"Return with an extra arp layer and a countermelody synth; maximum density. Energy through layering, not a drop. Vocal harmonies widest here."},{segment:"Outro",prompt:"Arp fragments into single notes; pad sustains; reverb tail rings out and fades to silence."}],drift_risks:[{risk:"Singer-songwriter acoustic drift: Suno strips the synths and turns it into confessional acoustic-guitar pop.",severity:"HIGH",fix:"State in prompt_body that EVERY section must contain synth arpeggios and pads; never write the word 'acoustic'; in each segment prompt always name a synth element that is present; keep 'no acoustic singer-songwriter' as a trailing style tag."},{risk:"Anonymous Max-Martin / billboard pop belting: the vocal turns generic and over-polished.",severity:"HIGH",fix:"Specify 'indie timbre, idiosyncratic, airy, reverb-drenched, never belted, layered not belted'; cite {refs} (CHVRCHES, Sylvan Esso) known for indie tone; keep lyric lines slightly abstract and image-based rather than pop-hook cliche."},{risk:"EDM build-and-drop / festival drop sneaks into the transitions.",severity:"MEDIUM",fix:"Ban 'drop/build/peak/anthemic' trigger words entirely; write 'filter sweep lift only' in each transition segment; use 'lift through texture' instead of 'build'."},{risk:"Trap hi-hat rolls / 808 subs creep into the drums.",severity:"MEDIUM",fix:"Anchor to 'LinnDrum drum machine, gated reverb snare on 2 and 4, steady 8th-note hats, plucky synth bass, no trap hats, no 808' in style tags and prompt_body."},{risk:"Drowsy dream-pop that loses propulsion (too sleepy / shoegaze).",severity:"LOW",fix:"Specify 'propulsive, driving, steady 8th hats, four-on-floor or strong backbeat'; keep BPM at 112 or above; ensure the gated snare hits every 2 and 4."}],dos:["Generate 6-8 takes; the first 1-2 are diagnostic — verify the verse still has synth arps and the vocal stays indie, not billboard-pop.","Keep every section anchored by a named synth element (arp, pad, FM bell, Prophet lead) so the production stays unmistakably electronic.","Master bright but warm around -9 to -10 LUFS; the gated snare should crack cleanly, not thud.","Use Custom Mode and never leave the lyrics field empty — provide the sparse image-based scaffold.","If a take drifts generic-pop, re-roll with MORE concrete indie-reference language rather than stacking more negatives (over-negating backfires)."],donts:["Don't use 'drop', 'build', 'peak', 'anthemic' — they prime Suno toward EDM and belting.","Don't let any section go acoustic-only — the genre is electronic at its core; every section needs a named synth element.","Don't use trap hi-hat rolls or 808 sub-bass — anchor to a LinnDrum-style drum machine.","Don't write generic pop-hook lyrics ('baby you're my everything') — keep imagery specific, slightly abstract, and indie.","Don't let the vocal turn polished Max-Martin — keep it airy, reverberant, idiosyncratic."]},
{id:"synthwave-retrowave",name:"Synthwave / Retrowave",bpm_range:"85-115",default_bpm:100,default_key:"A minor",default_vocal:"reverb-soaked nostalgic vocal — restrained, slightly distant, never belted; many sections instrumental with the synth lead as the voice",style_tags:"Jupiter-8 saw pads, Prophet-5 lead, driving saw bass, gated snare, LinnDrum groove, 16th arpeggios, saxophone, tape saturation, VHS warmth, no trap hats, no EDM drop, no 808s",prompt_body:"Synthwave / retrowave at {bpm} BPM, key {key}. The track is built on wide Jupiter-8-style analog saw pads and a driving saw-wave bass locked to a LinnDrum / Roland 707 groove — punchy kick, gated-reverb snare on 2 and 4, steady 8th-note hats. Arpeggiated synth lines cycle in 16ths across the stereo field, and a Prophet-5 lead carries the melody. A saxophone enters on choruses and the bridge for that outrun-night lift. Everything runs through tape saturation and VHS-style wow for warmth. References in the spirit of {refs}.\n\n{vocal} is drenched in plate reverb with long tails — nostalgic, restrained, slightly distant, never belted; many sections are instrumental with the synth lead (and sax) acting as the voice. Mood is {mood}: neon-lit, driving-down-an-empty-highway-at-2am, melancholic euphoria, retro-futuristic longing.\n\nDO NOT generate EDM festival build-and-drop, trap hi-hat rolls or 808 sub-bass, modern pop-house production, or generic royalty-free 80s pastiche. Energy advances by synth countermelodies, saxophone entries, and filter sweeps — never snare-roll-and-drop; tempo stays midtempo and the atmosphere stays cinematic.",references:["The Midnight","FM-84","Gunship","Kavinsky"],lyric_scaffold:"[Intro]\n(wide saw pad swell + 16th-note arp — instrumental)\n\n[Verse]\nheadlights on the rain\nyou were a frequency\nthe city humming low\n\n[Pre-Chorus]\n(arp accelerates, saw bass thickens)\n\n[Chorus]\nwe don't go back\nwe don't go back\nneon in the rearview\n\n[Instrumental]\n(Prophet-5 lead + saxophone countermelody, full groove)\n\n[Bridge]\n(strip to pad + bass pulse + gated snare)\n\n[Chorus]\nwe don't go back\nneon in the rearview\n\n[Outro]\n(saxophone closing phrase, reverb tail, slow fade)",segments:[{segment:"Intro",prompt:"Wide saw pad swells in; an arpeggiated synth enters in 16ths; kick-less for 4 bars to establish atmosphere. Tape saturation and VHS warmth on the whole bus."},{segment:"Verse",prompt:"Add the LinnDrum groove (punchy kick, gated snare on 2 and 4, 8th hats) and driving saw bass. Vocal enters, reverb-soaked and restrained. Arp continues cycling."},{segment:"Pre-Chorus",prompt:"Arp accelerates to a 32nd-note feel; bass thickens; pad filter opens. Vocal lifts in register but stays distant. No snare roll."},{segment:"Chorus",prompt:"Prophet-5 lead carries the melody; pads open wide; saxophone enters as countermelody. A warm filter sweep plus the sax entry provide the lift — no drop."},{segment:"Instrumental",prompt:"Full band: lead synth, sax, arp, driving bass — the groove rides. This is the peak, achieved by layering countermelodies, not by a build-and-drop."},{segment:"Bridge",prompt:"Strip to pad + bass pulse + gated snare only; a vocal fragment echoes with heavy delay. Cinematic, exposed, slow."},{segment:"Chorus",prompt:"Return with lead + sax + a second arp layer; maximum texture, midtempo groove fully intact. Energy through density, not a drop."},{segment:"Outro",prompt:"Sax plays a closing phrase; pad sustains; reverb tail rings out over a fading arp; slow fade to silence."}],drift_risks:[{risk:"EDM build-and-drop / big-room festival drop replaces the midtempo groove.",severity:"HIGH",fix:"Ban 'drop/build/peak' trigger words; in every transition segment write 'sax entry / synth countermelody / filter sweep only'; keep BPM at 100 and explicitly cap 'midtempo, do not accelerate'; add 'no EDM drop' as a trailing style tag."},{risk:"Darksynth / aggression drift — the track speeds up and turns harsh and metallic (Carpenter Brut territory) when you wanted The Midnight warmth.",severity:"HIGH",fix:"Anchor to midtempo {bpm} 90-110; specify 'warm, nostalgic, melodic, romantic, not aggressive'; cite melodic-vocal synthwave {refs} (The Midnight, FM-84); add 'no darksynth, no industrial aggression' to style tags."},{risk:"Trap 808 sub-bass replaces the analog saw bass.",severity:"MEDIUM",fix:"Specify 'driving saw-wave analog bass locked to the kick, no 808 subs, no trap 808s' in style tags and prompt_body."},{risk:"Cheesy royalty-free 80s muzak / generic pastiche with thin digital synths.",severity:"MEDIUM",fix:"Name concrete analog instruments (Jupiter-8 pads, Prophet-5 lead, LinnDrum/707 drums) and demand 'tape saturation, VHS warmth, analog depth'; cite {refs}."},{risk:"Over-belting power-ballad vocal.",severity:"LOW",fix:"Specify 'restrained, nostalgic, reverb-soaked, never belted; many sections instrumental'; keep vocal lines short, image-based, and let the sax/lead take the peak."}],dos:["Generate 6-8 takes; the first 1-2 are diagnostic — flag any snare-roll build, tempo push past 115 BPM, or harsh metallic top end (darksynth drift).","Name concrete analog gear (Jupiter-8, Prophet-5, LinnDrum/707) in tags and prompt to keep the timbre authentic, not generic 80s.","Let the saxophone and Prophet lead carry energy — that is the genre's lift mechanism, not drops.","Master wide and warm around -9 to -10 LUFS with tape-style saturation on the master; keep the low-mids full.","Use Custom Mode; mark long instrumental sections explicitly with [Instrumental] so Suno doesn't force vocals everywhere."],donts:["Don't use 'drop', 'build', 'peak', 'anthemic' — they prime EDM festival structure.","Don't push tempo above 115 BPM or it drifts toward darksynth aggression.","Don't use trap hats, 808 sub-bass, or modern pop-house production.","Don't use belting power-ballad vocals — keep them restrained, reverb-drenched, or leave sections instrumental.","Don't describe synths generically as '80s synths' — name Jupiter-8 / Prophet-5 / LinnDrum to avoid thin digital pastiche."]},
{id:"downtempo-trip-hop",name:"Downtempo / Trip-hop",bpm_range:"75-95",default_bpm:85,default_key:"D minor",default_vocal:"smoky melancholic torch vocal — close-mic'd, half-whispered in verses, aching in choruses, never belted, with delay and reverb tails",style_tags:"boom-bap breakbeat, vinyl crackle, dub delay, Rhodes, upright bass, Mellotron flute, wah guitar, jazz chords, noir smoke, half-time, no trap hats, no EDM drop, no chillhop",prompt_body:"Downtempo / trip-hop at {bpm} BPM, key {key}. The groove is a heavy, half-time boom-bap breakbeat (dusty Amen-style or shuffled live drums) under a deep upright acoustic bass and smoky Rhodes electric piano voicing minor-seventh jazz chords. Dub-style tape delay throws percussion and vocal fragments into echo; vinyl crackle and room tone sit low in the mix. Mellotron flute and wah-guitar accents drift in and out. Production is cinematic, noir, and deep — explicitly NOT lo-fi hip-hop study beats. References in the spirit of {refs}.\n\n{vocal} is a smoky, close-mic'd torch vocal — female or male — delivered with smoke and melancholy, half-whispered in verses, aching in choruses, never belted; delay and reverb tails trail every phrase. Mood is {mood}: rain-on-cobblestones noir, late-night cigarette cinema, beautiful unease.\n\nDO NOT generate lo-fi hip-hop / chillhop study beats, trap hi-hat rolls or 808 sub-bass, EDM build-and-drop, generic neo-soul / R&B polish, or upbeat dance grooves. Energy moves ONLY by texture, dub echo, and dynamic stripping — never build-and-drop; tempo stays slow (80-90 BPM) and minor.",references:["Portishead","Massive Attack","Bonobo","Thievery Corporation"],lyric_scaffold:"[Intro]\n(dusty breakbeat + vinyl crackle + Rhodes minor-sevenths — instrumental)\n\n[Verse]\nrain on the window\nyour name in the smoke\nthe hours go slow\n\n[Chorus]\nI keep the light off\nI keep the light off\nthe dark knows me better\n\n[Verse 2]\nfootsteps on the stair\na voice I almost knew\n\n[Bridge]\n(strip to upright bass + vocal + dub echo throws)\n\n[Chorus]\nI keep the light off\nthe dark knows me better\n\n[Outro]\n(Rhodes improvising softly, delay throws multiplying, slow fade)",segments:[{segment:"Intro",prompt:"Dusty breakbeat enters with vinyl crackle and room tone; Rhodes plays a minor-seventh progression; upright bass walks in. No vocal. Establish the smoke."},{segment:"Verse",prompt:"Vocal enters, smoky and close, half-whispered. Dub delay throws the last word of each line into echo. Wah-guitar accents fill the gaps between phrases."},{segment:"Chorus",prompt:"Bass deepens; Mellotron flute enters as countermelody; vocal aches but stays restrained, no belting. Texture thickens — no build."},{segment:"Verse 2",prompt:"Strip back slightly: drums, bass, Rhodes, vocal. A second vocal layer shadows the lead an octave below for weight."},{segment:"Bridge",prompt:"Breakbeat drops to just kick and rimshot; upright bass and vocal alone with heavy dub echo. Cinematic and exposed — the genre's signature breath."},{segment:"Chorus",prompt:"Return with full texture plus wah guitar and Mellotron; maximum smoke, slow groove fully intact. Energy through layering, not a drop."},{segment:"Outro",prompt:"Rhodes improvises softly; delay throws multiply and feed back; vinyl crackle rises; slow fade to silence."}],drift_risks:[{risk:"Lo-fi hip-hop / chillhop study-beat drift: Suno flattens it into a dusty 4-bar lofi loop with cartoon 'study beats' character, losing the cinematic trip-hop depth.",severity:"HIGH",fix:"Write 'cinematic noir trip-hop, NOT lo-fi hip-hop, NOT chillhop study beats' explicitly in prompt_body; specify live jazz instrumentation (Rhodes, upright acoustic bass, Mellotron flute) rather than 'dusty piano loop'; cite {refs} (Portishead, Massive Attack); never use the word 'lofi' in tags."},{risk:"Trap hi-hat rolls / modern hip-hop drums replace the breakbeat.",severity:"HIGH",fix:"Specify 'boom-bap breakbeat, live drums, shuffled, half-time, no trap hats, no 808' in style tags; reference a classic breakbeat feel."},{risk:"EDM build-and-drop / uplifting house energy.",severity:"MEDIUM",fix:"Anchor to 80-90 BPM, minor key, half-time; write 'energy by texture and dub echo only, no build, no drop' in every transition segment; ban 'drop/build/peak' words."},{risk:"Generic neo-soul / polished R&B vocal drift (soulful runs, belting).",severity:"MEDIUM",fix:"Specify 'torch vocal, smoke, half-whispered, restrained, noir, no runs, never belted'; cite a Beth Gibbons-style delivery and Portishead as reference."},{risk:"Tempo drifts upbeat / becomes lounge bossa or coffeehouse jazz.",severity:"LOW",fix:"Pin BPM to 85; specify 'downtempo, half-time, slow'; add 'no lounge, no bossa, no coffeehouse jazz' to style tags if the drift appears."}],dos:["Generate 6-8 takes; the first 1-2 are diagnostic — flag any trap hats, snare-roll builds, polished R&B vocal runs, or a sudden lofi-loop flattening.","Name concrete live instruments (Rhodes, upright bass, Mellotron, wah guitar) to keep it cinematic and deep, not loop-y.","Use dub delay and dynamic stripping as the energy mechanism — the genre breathes by REMOVING layers, not adding drops.","Master dark and warm around -12 to -10 LUFS; keep the low end deep but controlled; leave the vinyl crackle audible in the mix.","Use Custom Mode; keep lyrics fragmented, noir, and image-based (rain, smoke, dark, names) rather than narrative."],donts:["Don't call it 'lo-fi' or 'chillhop' anywhere in tags or prompt — Suno will flatten it into study beats. Say 'cinematic trip-hop' instead.","Don't use trap hats, 808 subs, snare-roll builds, or EDM drops.","Don't use 'drop', 'build', 'peak' — they prime EDM structure.","Don't use belting or soulful-run vocals — keep the torch delivery smoky and restrained.","Don't let the tempo drift past 90 BPM or toward bossa/lounge — pin it to 85."]},
{id:"lofi-chillhop",name:"Lo-fi / Chillhop",bpm_range:"70-90",default_bpm:80,default_key:"F# minor",default_vocal:"none (chopped wordless vocal sample optional)",style_tags:"dusty vinyl crackle, warm tape hiss, jazzy 7th/9th chords, boom-bap break, mellow Rhodes, felted piano, woozy detune, Dilla swing, no trap hats, no EDM drop, no 808 slides",prompt_body:"Warm, dusty lo-fi hip-hop at {bpm} BPM in {key}, built around jazzy extended chords (7ths, 9ths, 11ths) played on a slightly detuned Rhodes electric piano and a soft felted upright piano. A boom-bap drum break with loose, humanized, Dilla-style swing carries the groove — warm acoustic-sounding kick and snare, brushed hats, a gentle sidechain pump that pulls the pads under the beat. Sub bass sits low and round, never aggressive. Layer vinyl crackle, tape hiss, and a woozy pitch wobble (wow and flutter) over everything so the track feels taped, aged, and imperfect. {vocal}. The overall {mood} is unhurried and contemplative, in the spirit of {refs}.\n\nKeep the arrangement as one continuous loop-based groove — no risers, no snare-roll build-ups, no filter sweeps into a drop, no energy spikes. The drums enter, stay, and leave; textures shift through chord-voicing and mute/sustain changes rather than through builds. Exclude all EDM drop mechanics, trap 808 slides, hi-hat rolls, and any sung lead vocal — this is a late-night study instrumental with at most a chopped, wordless, pitched-down vocal sample.",references:["Nujabes","J Dilla","Idealism","Powfu"],lyric_scaffold:"[Intro]\n[Instrumental — vinyl crackle and felted piano motif, jazzy minor-9th chord]\n\n[Verse A]\n[Instrumental — boom-bap break enters, Rhodes on sidechain pump]\n\n[Chorus/Transition]\n[Instrumental — sub bass deepens, second Rhodes an octave up]\n\n[Bridge]\n[Instrumental — drums drop out, one chopped wordless vocal sample echoes]\n\n[Verse B]\n[Instrumental — drums return busier, muted trumpet or nylon-string guitar line]\n\n[Outro]\n[Instrumental — elements thin out one by one, piano motif and crackle fade]",segments:[{segment:"Intro",prompt:"Vinyl crackle fades in over a felted-piano motif stating a jazzy minor-9th chord; tape hiss and a slow woozy pitch wobble sit underneath. No drums yet."},{segment:"Verse A",prompt:"Boom-bap drum break enters with loose Dilla swing — warm kick, soft snare, brushed hats. Rhodes plays the chord progression on a gentle sidechain pump."},{segment:"Transition",prompt:"Sub bass deepens; a second layered Rhodes an octave up adds sparkle; hats tighten slightly. Texture thickens — no risers, no build, just a fuller chord stack."},{segment:"Bridge",prompt:"Drums drop out for four bars; piano, vinyl crackle, and tape hiss alone — then a single chopped, wordless, pitched-down vocal sample echoes once and fades."},{segment:"Verse B",prompt:"Drums return with a busier, ghost-note-rich break; a muted trumpet or nylon-string guitar adds a short improvised melody weaving between the chords."},{segment:"Outro",prompt:"Instruments thin out one by one — drums leave first, then the Rhodes, leaving the opening piano motif and vinyl crackle to fade into tape noise."}],drift_risks:[{risk:"Suno injects snare-roll risers and filter sweeps that climax in an EDM drop, destroying the steady study groove.",severity:"HIGH",fix:"State 'single steady groove throughout, no risers, no snare rolls, no filter-sweep drops, energy stays flat from bar 1 to end'; delete the trigger words 'drop','build','peak' entirely from prompt and style tags."},{risk:"Suno adds a confessional singing lead over the beat, turning instrumental study music into narrative pop.",severity:"HIGH",fix:"Set the {vocal} field to 'none / chopped wordless sample only'; mark every section [Instrumental] in the lyrics field; never leave the lyrics field empty."},{risk:"Suno modernizes the boom-bap break into trap: 808 slides and rolling hi-hats replace the dusty drums.",severity:"MEDIUM",fix:"Specify 'analog boom-bap drums, acoustic kick and snare, brushed hats; no 808 slides, no hi-hat rolls, no sub-bass glides'."},{risk:"Suno polishes away the vinyl dust and human swing, leaving flat royalty-free background muzak.",severity:"MEDIUM",fix:"List 'vinyl crackle, tape hiss, wow/flutter pitch wobble, unquantized humanized Dilla swing' as required elements, not optional flavor."},{risk:"Tempo creeps up toward 95-100 BPM and the track drifts into standard hip-hop.",severity:"LOW",fix:"Pin {bpm} at 75-85 and add 'mid-tempo, unhurried' to the prompt body."}],dos:["Use Custom Mode and mark EVERY section [Instrumental] unless you specifically want a chopped vocal sample.","Pin tempo at 75-85 BPM and restate 'mid-tempo, steady groove' to prevent upward tempo creep.","Generate 6-8 takes; the first 1-2 often carry EDM-drop contamination — treat them as diagnostic and discard.","Keep the lyrics field populated with [Instrumental] tags — an empty field triggers Suno's auto-pop-vocal writer.","Master warm around -10 LUFS and preserve the vinyl crackle in the final mix."],donts:["Don't use the trigger words 'drop', 'build', 'peak', or 'anthemic' — even negated they prime Suno toward EDM mechanics.","Don't add trap hi-hat rolls, 808 slides, or sub-bass glides to the style tags.","Don't remove the vinyl/tape texture to 'clean up' the sound — the dust and wobble ARE the genre.","Don't leave the lyrics field empty, or Suno writes confessional pop vocals over your beat."]},
{id:"ambient-cinematic",name:"Ambient / Cinematic",bpm_range:"60-90 (felt, often beatless)",default_bpm:70,default_key:"D minor",default_vocal:"none (wordless texture optional)",style_tags:"evolving synth pads, granular piano textures, sub-bass drone, cold reverb, tape loops, field recordings, opening filters, beatless atmosphere, long decay tails, no beat, no drop",prompt_body:"Beatless, slowly evolving ambient at roughly {bpm} BPM (felt, not counted) in {key}, built from layered synthesizer pads with long attack and release, granular-processed piano fragments, and sub-bass drones that breathe beneath the surface. Textures morph over 30-60 second arcs — filter cutoffs open and close slowly, tape loops drift in and out of tune, and field recordings (rain, room tone, distant traffic) sit just under the music. Reverb tails are cavernous and cold; decay times are long, with notes bleeding into one another. {vocal}. The overall {mood} is wide and weightless, evoking {refs}.\n\nThe piece must remain beatless throughout — no drum machine, no kick pattern, no four-on-the-floor, no percussion loop ever enters. Energy advances by texture, density, and slow filter movement, never by build-and-drop or rhythmic intensification. Exclude EDM risers, festival drops, new-age pan flutes, wind chimes, twinkling bells, angelic-choir pads, and any 'epic' trailer swell. There is no climax — the arc is a slow horizontal drift.",references:["Brian Eno","Stars of the Lid","Hammock","Tim Hecker"],lyric_scaffold:"[Intro]\n[Instrumental — single pad fades in from silence over 20s, low sub-bass drone, faint rain field recording]\n\n[Section A]\n[Instrumental — granular piano fragments scatter stereo-wide, second pad enters an octave up, filter slowly opening]\n\n[Section B]\n[Instrumental — strings swell into sustained minor chords, reverb tails bleed together, sub shifts down a fifth]\n\n[Section C]\n[Instrumental — high shimmering texture (bowed glass / processed drone) enters and holds; density peaks, no rhythmic pulse]\n\n[Section D]\n[Instrumental — pads thin, filter closes on the high pad, distant-traffic field recording surfaces]\n\n[Outro]\n[Instrumental — all recedes into a single low drone and room tone, fading to near-silence over 30s]",segments:[{segment:"Intro",prompt:"A single sustained pad fades in from silence over 20 seconds; low sub-bass drone underneath; a field recording of rain is barely audible below the music."},{segment:"Section A",prompt:"Granular piano fragments scatter across the stereo field; a second pad enters an octave up with its filter slowly opening over 30 seconds."},{segment:"Section B",prompt:"Texture thickens — bowed strings swell into long minor chords whose reverb tails bleed into each other; the sub-bass shifts down a fifth. No pulse."},{segment:"Section C",prompt:"A high shimmering texture enters (slowly bowed glass or a processed drone) and sustains; density peaks here without any rhythmic intensification."},{segment:"Section D",prompt:"Pads begin to thin; the filter closes slowly on the high pad; the distant-traffic field recording becomes more present in the mix."},{segment:"Outro",prompt:"Everything recedes into a single low drone and room tone, fading to near-silence over the final 30 seconds."}],drift_risks:[{risk:"Suno veers into twinkly wind-chime and pan-flute 'yoga/spa' music, saccharine and bright, losing the cold/textural edge.",severity:"HIGH",fix:"Specify 'granular textures, dissonant intervals, cold spacious reverb, field recordings, sub-bass drone' and explicitly 'no pan flute, no wind chimes, no twinkling bells, no music-box, no angelic choir'."},{risk:"Suno cannot resist introducing a kick-drum pulse or four-on-the-floor groove partway through, flipping ambient into progressive house.",severity:"HIGH",fix:"State 'beatless throughout, no drum machine, no kick pattern, no percussion loop ever enters'; set {vocal} to 'none / wordless texture'."},{risk:"A slow textural swell escalates into a euphoric EDM drop, turning ambient into Balearic dance.",severity:"MEDIUM",fix:"Specify 'no build, no climax, no drop, no riser, no snare roll'; prefer 'slow horizontal drift, texture morphs but energy never spikes'."},{risk:"Plastic digital preset pads that sound like a 2000s workstation keyboard rather than living texture.",severity:"MEDIUM",fix:"Insist on 'granular processing, tape loops, layered field recordings, analog detuning, long attack/release envelopes' in the prompt body."},{risk:"A wordless 'ahh' vocal develops into a melodic pop hook and pulls the piece toward vocal-led cinema.",severity:"LOW",fix:"Keep [Instrumental] tags everywhere; if a voice is wanted specify 'wordless drone texture, no lyrics, no melodic contour'."}],dos:["Use Custom Mode with [Instrumental] marked in every section; leave no section expecting a vocal.","Describe textures by their MOTION ('slowly opening filter over 30s', 'granular grains scatter') — emotion words alone let Suno fill in stock pads.","Layer at least one concrete real-world sound source (rain field recording, tape loop, bowed metal) so Suno builds texture instead of preset pads.","Generate 4-8 takes; ambient is especially prone to first-take spa-music or sudden-beat drift — discard early takes that develop a pulse.","Reference concrete production techniques (granular processing, tape, long reverb tails) so the model avoids stock workstation synths."],donts:["Don't use 'epic', 'cinematic build', 'swell to climax', or 'anthemic' — they trigger EDM-style drops.","Don't request a beat, kick, or percussion loop unless you genuinely want one — Suno will add a four-on-the-floor by default.","Don't put pan flute, wind chimes, music-box, or 'angelic' in the positives — they are the spa-drift gateway.","Don't leave the lyrics field empty; mark [Instrumental] in every section."]},
{id:"orchestral-neoclassical",name:"Orchestral / Neo-classical",bpm_range:"60-110 (rubato)",default_bpm:75,default_key:"A minor",default_vocal:"none",style_tags:"felted upright piano, string quartet, recital-hall acoustics, rubato phrasing, modal minor harmony, sparse motifs, warm room reverb, neoclassical, no beat, no synth",prompt_body:"Intimate neo-classical chamber music at {bpm} BPM (rubato, breathing tempo) in {key}, scored for felted upright piano and a small string ensemble (two violins, viola, cello) recorded in a wood-paneled recital hall with natural room reverb. The piano is played with the soft pedal down — muted, felted, close-mic'd so hammer and string noise is audible. Strings sustain long modal chords with slow bows, natural vibrato, and audible bow changes; countermelodies enter one voice at a time so the texture stays transparent. {vocal}. The feeling is {mood}, akin to {refs}.\n\nKeep the scale intimate and chamber-sized — never expand to full symphonic forces, and never introduce electronic elements, drum kits, synth pads, sub-bass, or trailer-style braams and impacts. Tempo is rubato and expressive, not grid-quantized. Exclude EDM beats, pop vocal hooks, Hans-Zimmer bombast, cheap General-MIDI string patches, and any quantized percussion. The whole piece must sound performed by humans in a real room, not sequenced in a DAW.",references:["Nils Frahm","Olafur Arnalds","Max Richter","Ludovico Einaudi"],lyric_scaffold:"[Intro]\n[Instrumental — felted upright piano alone, rubato, soft pedal down, main motif over suspended minor chord]\n\n[Phrase A]\n[Instrumental — solo cello enters sustaining root, viola countermelody, sparse right-hand piano figures]\n\n[Phrase B]\n[Instrumental — second violin enters, four-voice sustained chord, rolling piano arpeggios beneath]\n\n[Middle]\n[Instrumental — key modulates, cello takes melody an octave lower, piano block chords, violins hold high sustained note]\n\n[Phrase C]\n[Instrumental — quartet returns to the original motif in unison, breaks to harmony, dynamic rises briefly to mezzo-forte]\n\n[Outro]\n[Instrumental — instruments drop away one by one, piano restates opening motif alone, slower, ending on an unresolved suspended chord]",segments:[{segment:"Intro",prompt:"Felted upright piano alone, rubato, states the main motif over a suspended minor chord; soft pedal down, wood-room reverb."},{segment:"Phrase A",prompt:"Solo cello enters sustaining the root, then viola adds a countermelody; piano continues with sparse right-hand figures."},{segment:"Phrase B",prompt:"Second violin enters; the quartet sustains a richer four-voice chord while the piano plays rolling arpeggios beneath."},{segment:"Middle",prompt:"Key modulates; cello takes the melody an octave lower, piano switches to block chords, violins hold a high sustained note."},{segment:"Phrase C",prompt:"Full quartet returns to the original motif in unison, then breaks into harmony; dynamic rises briefly to a restrained mezzo-forte."},{segment:"Outro",prompt:"Instruments drop away one by one; piano restates the opening motif alone, slower, ending on an unresolved suspended chord."}],drift_risks:[{risk:"Plastic sample-library / General-MIDI string sound with no bow noise or room — the #1 giveaway of fake orchestral.",severity:"HIGH",fix:"Specify 'real recorded string ensemble, audible bow changes, natural vibrato, wood-paneled hall acoustics, close-mic plus room mic'; add 'performed live by a chamber quartet in a recital hall' and reference 'felted piano, muted strings'."},{risk:"Suno layers a drum-machine beat or synth sub-bass under the ensemble, modernizing it into trailer/electronic music.",severity:"HIGH",fix:"State 'no drum kit, no electronic percussion, no synth pad, no sub-bass — acoustic ensemble only'; keep [Instrumental] throughout."},{risk:"Expands into thunderous two-note Hans-Zimmer braams and epic trailer stabs.",severity:"MEDIUM",fix:"Specify 'intimate chamber scale, small ensemble, no braams, no trailer hits, dynamics stay piano to mezzo-forte, no fortissimo climax'."},{risk:"A sung melodic hook creeps in and the piece becomes a pop ballad with string backing.",severity:"MEDIUM",fix:"Set {vocal} to 'none'; mark all sections [Instrumental]; if a voice is truly wanted specify 'wordless hum, no lyrics, no melody'."},{risk:"Loses rubato expression and locks to a rigid grid, sounding sequenced rather than performed.",severity:"LOW",fix:"Specify 'rubato, breathing tempo, expressive unquantized timing' in the prompt body."}],dos:["Specify real-room recording detail (hall acoustics, bow noise, natural vibrato, close+room mics) to defeat the plastic-MIDI default.","Mark every section [Instrumental]; neo-classical is almost always wordless.","Use 'rubato, breathing tempo' so the model keeps expressive timing instead of locking to a sterile grid.","Generate 6-8 takes; cheap-string and beat-injection drift are common in early takes and correct with regeneration.","Name a concrete instrumentation (felted piano + string quartet) rather than the vague word 'orchestra'."],donts:["Don't use 'epic', 'trailer', 'cinematic climax', or 'anthemic' — they push toward bombast and braams.","Don't add a drum kit, synth pad, sub-bass, or any electronic element to the style tags or prompt.","Don't scale up to 'full symphony orchestra' — chamber-scale intimacy is the genre.","Don't leave the lyrics field empty, or Suno may add a sung pop hook over the strings."]},
{id:"folk-acoustic",name:"Folk / Singer-Songwriter Acoustic",bpm_range:"70-105",default_bpm:85,default_key:"G major",default_vocal:"warm, breathy, close-mic'd lead (male or female)",style_tags:"fingerpicked acoustic guitar, open tunings, upright bass, brushed snare, small woodsy room, short reverb, minimal arrangement, honest storytelling, no drums, no trap hats",prompt_body:"A warm, intimate folk arrangement at {bpm} BPM in {key}, centered on a steel-string acoustic guitar played fingerstyle with open tunings and thumb-picked Travis patterns, alongside a close-mic'd lead vocal. {vocal} — delivered softly, breathy, and conversational, never belted, recorded so close that breath and lip noise is part of the sound. A softly brushed snare or foot stomp may enter late, an upright bass walks gently underneath, and a second acoustic guitar doubles select phrases for warmth. The room is small and woodsy; reverb is short and natural, never glossy. The overall {mood} is plain and human, in the vein of {refs}.\n\nKeep the arrangement minimal and human — one acoustic guitar and one voice for long stretches, with other instruments entering sparingly and never all at once. Never introduce drum machines, electronic beats, trap hats, 808s, auto-tuned pop vocal production, stadium reverb, or any electric or amplified instrument. The vocal stays restrained and storytelling throughout — no melismatic runs, no power-belted choruses, no pop-hook production tricks. The song should feel like it is being performed live in a small room.",references:["Bon Iver","Iron & Wine","Adrianne Lenker","Jose Gonzalez"],lyric_scaffold:"[Intro]\n[Instrumental — solo acoustic guitar fingerpicking, open tuning, audible fret and string noise]\n\n[Verse 1]\nThe road was longer than the light\nI kept your name out of the night\n[Soft upright bass enters beneath]\n\n[Chorus]\nOh, the river don't remember\nEvery stone that made it wide\n[Brushed snare enters lightly, second guitar an octave up]\n\n[Verse 2]\nI left the window open late\nThe cold came in and took the weight\n[Travis-picked guitar, vocal lower and more conversational]\n\n[Bridge]\n[Instruments drop to guitar and voice alone]\nIf you are listening at all\n[A soft lap-steel or harmonica colors one phrase]\n\n[Chorus]\nOh, the river don't remember\nEvery stone that made it wide\n[A single quiet harmony vocal joins the lead]\n\n[Outro]\n[Guitar and voice alone again]\nThe road was longer than the light\n[Resolves to a natural harmonic, final line whispered]",segments:[{segment:"Intro",prompt:"Solo steel-string acoustic guitar fingerpicks an open-tuning figure; small-room ambience, faint fret noise. No vocal yet."},{segment:"Verse 1",prompt:"Lead vocal enters close and breathy over the same guitar pattern; an upright bass walks softly underneath."},{segment:"Chorus",prompt:"A lightly brushed snare enters; a second acoustic guitar doubles the figure an octave up; the vocal opens slightly but stays intimate — never belts."},{segment:"Verse 2",prompt:"Guitar moves to a Travis-picked pattern; the vocal tells the next line of the story, lower and more conversational."},{segment:"Bridge",prompt:"Bass and brush drop out; vocal and guitar alone for four bars, then a soft lap-steel or harmonica colors a single phrase."},{segment:"Chorus",prompt:"Full minimal arrangement returns; a single quiet harmony vocal joins the lead for the first time."},{segment:"Outro",prompt:"Instruments thin to guitar and voice; the guitar resolves to a natural harmonic; the vocal trails off with a final whispered line."}],drift_risks:[{risk:"Suno adds glossy reverb, polished backing, and stadium drums, turning the intimate folk track into Billboard pop.",severity:"HIGH",fix:"Specify 'intimate close-mic, small woodsy room, short natural reverb, minimal arrangement, sounds live in a small room, no glossy production'; prefer 'room ambience' over 'reverb'."},{risk:"Suno drops a drum-machine or trap beat under the acoustic guitar, modernizing it into pop or folk-trap.",severity:"HIGH",fix:"State 'acoustic instruments only, no drum machine, no electronic elements; brushed snare or single stomp at most, never a full kit'."},{risk:"The intimate verse vocal suddenly shifts to melismatic pop belting on the chorus, breaking the mood.",severity:"MEDIUM",fix:"Specify 'restrained, breathy, conversational delivery throughout, narrow dynamic range, never belts, no melismatic runs'; keep the chorus dynamic close to the verse."},{risk:"Rolling trap hi-hats and 808 sub-bass appear under the guitar as Suno's default modernization.",severity:"MEDIUM",fix:"Add 'no trap hats, no 808s, no sub-bass slides; upright bass only, no amplified or electronic instruments'."},{risk:"The vocal gets auto-tuned into a glossy, pitch-corrected pop lead with no human imperfection.",severity:"MEDIUM",fix:"Specify 'natural unprocessed vocal, audible breath and lip noise, room reverberation, no auto-tune, no pitch correction'."}],dos:["Keep the arrangement to 'one acoustic guitar and one voice' for the majority of the runtime — add one instrument at a time, sparingly.","Describe the vocal posture precisely ('breathy, close-mic'd, conversational, never belts, audible breath') to lock the delivery before Suno can push it toward pop belting.","Write real, concrete, image-based lyrics — folk is vocal-driven, so only the intro should be [Instrumental].","Reference open tunings and fingerstyle / Travis-picking technique to anchor the guitar sound away from strummed pop-rock.","Generate 6-8 takes; pop-sheen and beat-injection drift are common in early takes and need regeneration to correct."],donts:["Don't add 'drums', 'beat', 'electronic', 'anthemic', or 'big chorus' to the style tags or prompt.","Don't use stadium or large-hall reverb — keep it small-room and natural.","Don't request a 'power vocal', 'belting', or 'soaring chorus' — these flip the track into pop.","Don't leave the lyrics field empty; Suno will write generic pop lyrics that clash with the intimate sound."]},
{id:"pop-radio",name:"Pop / Radio",bpm_range:"95-128",default_bpm:118,default_key:"Eb major",default_vocal:"polished mixed-voice pop lead, female, bright and controlled, light disciplined melisma",style_tags:"radio pop, glossy synth-pop production, punchy layered drums, syncopated bass, clean guitar stabs, hook-driven, ear-candy synths, four-on-floor feel, no trap hats, no EDM drop",prompt_body:"Glossy contemporary {mood} radio pop at {bpm} BPM in {key}, styled after {refs}. The track is built on a clean, punchy drum program — tight kick, crisp snare/clap on 2-and-4, acoustic-layered percussion — over a syncopated, bouncing bassline and bright synth-pop pads. Clean electric guitar stabs and a signature ear-candy pluck (marimba, bell, or vocal chop) define the hook, with tight layered backing vocals widening the chorus. The groove stays in the pocket: energy advances by texture, filter sweeps, and stacked vocals — never by a build-and-drop.\n\n{vocal}: a controlled mixed-voice pop lead sitting bright and forward, disciplined melisma, conversational in verses with a lifted, restrained chorus. Phrasing is modern and rhythmic, never diva-belting or oversung.\n\nEXCLUSIONS — no EDM festival supersaw drops, no trap hi-hats or 808 sub-bass, no snare-roll or white-noise risers, no singer-songwriter acoustic intimacy, no lo-fi dust or royalty-free muzak feel, no anonymous wallpaper pop. Transitions move by filter and texture, not by riser or drop.",references:["Dua Lipa","Taylor Swift","The Weeknd","Harry Styles"],lyric_scaffold:"[Intro]\n(ear-candy pluck hook + light vocal chop, 4 bars)\n\n[Verse 1]\nYou got the room spinning sideways\nGold on the rim of my glass\nWe're talking in circles, you're smiling\nI'm already gone from the past\n\n[Pre-Chorus]\nAnd the lights go down, down, down\nEvery move you make is loud\n\n[Chorus]\nWe don't need a reason, we just keep on dancing\nHeart on the ceiling, gold on the feeling\nWe don't need a reason, we just keep on—\n(pluck hook re
